<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 - Snapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/header :: headerStyles}"></th:block>
    <style>
        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
        }

        .dm-container {
            max-width: 760px;
            margin: 72px auto 0;
            background: #fff;
            border: 1px solid #ebebeb;
            border-radius: 12px;
            height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
        }

        /* 헤더 */
        .dm-header {
            padding: 14px 20px;
            border-bottom: 1px solid #ebebeb;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
        }
        .dm-header-back {
            font-size: 20px;
            text-decoration: none;
            color: #262626;
            margin-right: 2px;
            line-height: 1;
        }
        .dm-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ebebeb;
        }
        .dm-header-name {
            font-size: 14px;
            font-weight: 600;
            color: #111;
        }

        /* 메시지 영역 */
        .dm-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .dm-messages::-webkit-scrollbar { width: 4px; }
        .dm-messages::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 99px; }

        /* 메시지 행 */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            margin-bottom: 2px;
        }
        .msg-row.mine { flex-direction: row-reverse; }

        /* 메시지 그룹 (스토리 답장 + 메시지 묶음) */
        .msg-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 65%;
        }
        .msg-row.mine .msg-group { align-items: flex-end; }
        .msg-row:not(.mine) .msg-group { align-items: flex-start; }

        /* 스토리 답장 미리보기 */
        .story-reply-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px 14px 4px 14px;
            padding: 8px 10px;
            cursor: pointer;
            transition: background 0.15s;
            max-width: 220px;
        }
        .msg-row.mine .story-reply-preview {
            background: rgba(0,149,246,0.12);
            border-color: rgba(0,149,246,0.2);
            border-radius: 14px 14px 14px 4px;
        }
        .story-reply-preview:hover { filter: brightness(0.97); }

        .story-reply-thumb {
            width: 44px;
            height: 54px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #e8e8e8;
        }
        .story-reply-thumb.expired {
            background: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .story-reply-info { flex: 1; min-width: 0; }
        .story-reply-label {
            font-size: 11px;
            color: #8e8e8e;
            margin-bottom: 2px;
        }
        .msg-row.mine .story-reply-label { color: rgba(0,149,246,0.8); }
        .story-reply-expired-text {
            font-size: 12px;
            color: #aaa;
        }

        /* 말풍선 */
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
            max-width: 100%;
        }
        .msg-bubble.mine {
            background: #0095f6;
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        .msg-bubble.theirs {
            background: #f0f0f0;
            color: #111;
            border-bottom-left-radius: 6px;
        }

        /* 메타 (시간/읽음) */
        .msg-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1px;
            flex-shrink: 0;
            padding-bottom: 2px;
        }
        .msg-row:not(.mine) .msg-meta { align-items: flex-start; }
        .msg-time { font-size: 11px; color: #b0b0b0; }
        .msg-read { font-size: 11px; color: #b0b0b0; }

        /* 입력 영역 */
        .dm-input-area {
            padding: 12px 16px;
            border-top: 1px solid #ebebeb;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
        }
        .dm-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 22px;
            font-size: 14px;
            font-family: 'Instrument Sans', sans-serif;
            outline: none;
            resize: none;
            max-height: 100px;
            overflow-y: auto;
            transition: border-color 0.2s;
            background: #fafafa;
            line-height: 1.4;
        }
        .dm-input:focus { border-color: #0095f6; background: #fff; }
        .dm-send-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Instrument Sans', sans-serif;
            cursor: pointer;
            padding: 0 4px;
            transition: opacity 0.15s;
        }
        .dm-send-btn:hover { opacity: 0.75; }
        .dm-send-btn:disabled { color: #b2dffc; cursor: default; }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="dm-container">
    <div class="dm-header">
        <a href="/dm/list" class="dm-header-back">←</a>
        <img th:src="${opponent?.profileImageUrl != null} ? '/upload/' + ${opponent.profileImageUrl} : 'https://i.pravatar.cc/150?u=' + ${opponent?.uid}"
             alt="프로필" class="dm-header-avatar">
        <span class="dm-header-name" th:text="${opponent?.snapiaId}">사용자</span>
    </div>

    <div class="dm-messages" id="messageList">
        <div th:each="msg : ${messageList}">
            <div th:class="${msg.senderId == currentUid} ? 'msg-row mine' : 'msg-row'">
                <div class="msg-group">
                    <!-- 스토리 답장 미리보기 (서버에서 replyStoryImgUrl 있을 때) -->
                    <div th:if="${msg.replyStoryImgUrl != null}"
                         th:class="${msg.senderId == currentUid} ? 'story-reply-preview' : 'story-reply-preview'"
                         th:onclick="${msg.replyStorySid != null} ? 'location.href=\'/story/\' + ' + ${msg.replyStorySid} : ''">
                        <img th:src="'/upload/' + ${msg.replyStoryImgUrl}"
                             class="story-reply-thumb"
                             alt="스토리"
                             onerror="this.style.display='none'">
                        <div class="story-reply-info">
                            <div class="story-reply-label">스토리에 답장</div>
                        </div>
                    </div>
                    <!-- 만료된 스토리 -->
                    <div th:if="${msg.replyStoryImgUrl == null and msg.replyStorySid != null}"
                         class="story-reply-preview">
                        <div class="story-reply-thumb expired"></div>
                        <div class="story-reply-info">
                            <div class="story-reply-label">스토리에 답장</div>
                            <div class="story-reply-expired-text">만료된 스토리</div>
                        </div>
                    </div>
                    <div th:class="${msg.senderId == currentUid} ? 'msg-bubble mine' : 'msg-bubble theirs'"
                         th:text="${msg.content}">메시지</div>
                </div>
                <div class="msg-meta">
                    <span class="msg-time"
                          th:text="${msg.dateTime != null} ? ${#temporals.format(msg.dateTime, 'HH:mm')} : ''"></span>
                    <span class="msg-read"
                          th:if="${msg.senderId == currentUid}"
                          th:text="${msg.readStatus != null and msg.readStatus.name() == 'READ'} ? '읽음' : '안읽음'"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="dm-input-area">
        <textarea id="msgInput" class="dm-input" placeholder="메시지 입력..." rows="1"></textarea>
        <button id="sendBtn" class="dm-send-btn" onclick="sendMessage()">전송</button>
    </div>
</div>

<script th:inline="javascript">
    const roomId = [[${roomId}]];
    const currentUid = [[${currentUid}]];

    const messageList = document.getElementById('messageList');
    messageList.scrollTop = messageList.scrollHeight;

    const msgInput = document.getElementById('msgInput');
    let isComposing = false;
    msgInput.addEventListener('compositionstart', () => isComposing = true);
    msgInput.addEventListener('compositionend', () => isComposing = false);
    msgInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey && !isComposing) {
            event.preventDefault();
            sendMessage();
        }
    });

    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function () {
        stompClient.subscribe(`/s/dm/${roomId}`, function (message) {
            const msg = JSON.parse(message.body);
            appendMessage(msg);
        });
    });

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const content = input.value.trim();
        if (!content) return;
        stompClient.send('/p/dm/send', {}, JSON.stringify({ roid: roomId, content: content }));
        input.value = '';
    }

    function appendMessage(msg) {
        const isMine = msg.senderId === currentUid;

        const row = document.createElement('div');
        row.className = isMine ? 'msg-row mine' : 'msg-row';

        const group = document.createElement('div');
        group.className = 'msg-group';

        // 스토리 답장 미리보기
        if (msg.replyStoryImgUrl || msg.replyStorySid) {
            const preview = document.createElement('div');
            preview.className = 'story-reply-preview';
            if (msg.replyStorySid) {
                preview.style.cursor = 'pointer';
                preview.onclick = () => location.href = `/story/${msg.replyStorySid}`;
            }

            if (msg.replyStoryImgUrl) {
                const thumb = document.createElement('img');
                thumb.className = 'story-reply-thumb';
                thumb.src = `/upload/${msg.replyStoryImgUrl}`;
                thumb.alt = '스토리';
                thumb.onerror = () => thumb.style.display = 'none';
                preview.appendChild(thumb);
            } else {
                const expiredThumb = document.createElement('div');
                expiredThumb.className = 'story-reply-thumb expired';
                preview.appendChild(expiredThumb);
            }

            const info = document.createElement('div');
            info.className = 'story-reply-info';
            info.innerHTML = `<div class="story-reply-label">스토리에 답장</div>`;
            if (!msg.replyStoryImgUrl) {
                info.innerHTML += `<div class="story-reply-expired-text">만료된 스토리</div>`;
            }
            preview.appendChild(info);
            group.appendChild(preview);
        }

        const bubble = document.createElement('div');
        bubble.className = isMine ? 'msg-bubble mine' : 'msg-bubble theirs';
        bubble.textContent = msg.content;
        group.appendChild(bubble);

        const meta = document.createElement('div');
        meta.className = 'msg-meta';

        const time = document.createElement('span');
        time.className = 'msg-time';
        if (msg.dateTime) {
            const d = new Date(msg.dateTime);
            time.textContent = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }
        meta.appendChild(time);

        if (isMine) {
            const readSpan = document.createElement('span');
            readSpan.className = 'msg-read';
            readSpan.textContent = (msg.readStatus === 'READ') ? '읽음' : '안읽음';
            meta.appendChild(readSpan);
        }

        row.appendChild(group);
        row.appendChild(meta);
        messageList.appendChild(row);
        messageList.scrollTop = messageList.scrollHeight;
    }
</script>

<th:block th:replace="~{fragments/header :: headerScript}"></th:block>
</body>
</html>
