<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 - Snapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <th:block th:replace="~{fragments/header :: headerStyles}"></th:block>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        .dm-container {
            max-width: 935px;
            margin: 80px auto 0;
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }

        .dm-header {
            padding: 14px 20px;
            border-bottom: 1px solid #dbdbdb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dm-header-back {
            font-size: 20px;
            text-decoration: none;
            color: #262626;
            margin-right: 4px;
        }

        .dm-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #dbdbdb;
        }

        .dm-header-name {
            font-size: 14px;
            font-weight: 600;
            color: #262626;
        }

        .dm-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            margin-bottom: 2px;
        }

        .msg-row.mine {
            flex-direction: row-reverse;
        }

        .msg-bubble {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 22px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-bubble.mine {
            background-color: #0095f6;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-bubble.theirs {
            background-color: #efefef;
            color: #262626;
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            flex-shrink: 0;
        }

        .msg-row:not(.mine) .msg-meta {
            align-items: flex-start;
        }

        .msg-time {
            font-size: 11px;
            color: #8e8e8e;
        }

        .msg-read {
            font-size: 11px;
            color: #8e8e8e;
        }

        .dm-input-area {
            padding: 16px 20px;
            border-top: 1px solid #dbdbdb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dm-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #dbdbdb;
            border-radius: 22px;
            font-size: 14px;
            outline: none;
            resize: none;
            max-height: 100px;
            overflow-y: auto;
        }

        .dm-input:focus {
            border-color: #a8a8a8;
        }

        .dm-send-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .dm-send-btn:hover {
            color: #1877f2;
        }

        .dm-send-btn:disabled {
            color: #b2dffc;
            cursor: default;
        }
    </style>
</head>
<body class="bg-gray-50">

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="dm-container">
    <!-- 헤더 -->
    <div class="dm-header">
        <a href="/dm/list" class="dm-header-back">←</a>
        <img th:src="${opponent?.profileImageUrl != null} ? '/upload/' + ${opponent.profileImageUrl} : 'https://i.pravatar.cc/150?u=' + ${opponent?.uid}"
             alt="프로필" class="dm-header-avatar">
        <span class="dm-header-name" th:text="${opponent?.snapiaId}">사용자</span>
    </div>

    <!-- 메시지 목록 -->
    <div class="dm-messages" id="messageList">
        <div th:each="msg : ${messageList}">
            <div th:class="${msg.senderId == currentUid} ? 'msg-row mine' : 'msg-row'">
                <div th:class="${msg.senderId == currentUid} ? 'msg-bubble mine' : 'msg-bubble theirs'"
                     th:text="${msg.content}">메시지</div>
                <div class="msg-meta">
                    <span class="msg-time"
                          th:text="${msg.dateTime != null} ? ${#temporals.format(msg.dateTime, 'HH:mm')} : ''"></span>
                    <span class="msg-read"
                          th:if="${msg.senderId == currentUid}"
                          th:text="${msg.readStatus != null and msg.readStatus.name() == 'READ'} ? '읽음' : '안읽음'"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 입력창 -->
    <div class="dm-input-area">
        <textarea id="msgInput" class="dm-input" placeholder="메시지 입력..." rows="1"></textarea>
        <button id="sendBtn" class="dm-send-btn" onclick="sendMessage()">전송</button>
    </div>
</div>

<script th:inline="javascript">
    const roomId = [[${roomId}]];
    const currentUid = [[${currentUid}]];

    const messageList = document.getElementById('messageList');
    messageList.scrollTop = messageList.scrollHeight;

    const msgInput = document.getElementById('msgInput');
    let isComposing = false;
    msgInput.addEventListener('compositionstart', () => isComposing = true);
    msgInput.addEventListener('compositionend', () => isComposing = false);
    msgInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey && !isComposing) {
            event.preventDefault();
            sendMessage();
        }
    });

    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function () {
        stompClient.subscribe(`/s/dm/${roomId}`, function (message) {
            const msg = JSON.parse(message.body);
            appendMessage(msg);
        });
    });

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const content = input.value.trim();
        if (!content) return;

        stompClient.send('/p/dm/send', {}, JSON.stringify({
            roid: roomId,
            content: content
        }));

        input.value = '';
    }

    function appendMessage(msg) {
        const isMine = msg.senderId === currentUid;

        const row = document.createElement('div');
        row.className = isMine ? 'msg-row mine' : 'msg-row';

        const bubble = document.createElement('div');
        bubble.className = isMine ? 'msg-bubble mine' : 'msg-bubble theirs';
        bubble.textContent = msg.content;

        const meta = document.createElement('div');
        meta.className = 'msg-meta';

        const time = document.createElement('span');
        time.className = 'msg-time';
        if (msg.dateTime) {
            const d = new Date(msg.dateTime);
            time.textContent = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }
        meta.appendChild(time);

        if (isMine) {
            const readSpan = document.createElement('span');
            readSpan.className = 'msg-read';
            readSpan.textContent = (msg.readStatus === 'READ') ? '읽음' : '안읽음';
            meta.appendChild(readSpan);
        }

        row.appendChild(bubble);
        row.appendChild(meta);
        messageList.appendChild(row);
        messageList.scrollTop = messageList.scrollHeight;
    }
</script>

<th:block th:replace="~{fragments/header :: headerScript}"></th:block>
</body>
</html>
