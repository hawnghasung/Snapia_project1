<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>로그인</title>
</head>
<body>
<h2>로그인</h2>
<form th:action="@{/login}" method="post">
    <div>
        <label>아이디/이메일/번호:</label>
        <input type="text" name="loginId" placeholder="이메일, 전화번호 또는 아이디" required>
    </div>
    <div>
        <label>비밀번호:</label>
        <input type="password" name="password" required>
    </div>
    <div th:if="${param.error}">
        로그인 정보가 올바르지 않습니다.
    </div>
    <button type="submit">로그인</button>
</form>
<p>계정이 없으신가요? <a th:href="@{/join}">회원가입</a></p>
</body>
</html>
