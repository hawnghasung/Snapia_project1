<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팔로잉 - Snapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/header :: headerStyles}"></th:block>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
        }
        .page-wrap { max-width: 480px; margin: 80px auto 40px; padding: 0 16px; }
        .card { background: #fff; border: 1px solid #dbdbdb; border-radius: 4px; overflow: hidden; }
        .card-header {
            padding: 14px 16px; border-bottom: 1px solid #efefef;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .card-title { font-size: 15px; font-weight: 700; color: #262626; }
        .card-back {
            position: absolute; left: 14px; font-size: 20px;
            cursor: pointer; color: #262626; text-decoration: none; line-height: 1;
        }
        .card-back:hover { opacity: 0.6; }
        .follow-item {
            display: flex; align-items: center; padding: 10px 16px; gap: 12px;
            border-bottom: 1px solid #f5f5f5; transition: background 0.1s;
        }
        .follow-item:last-child { border-bottom: none; }
        .follow-item:hover { background: #fafafa; }
        .follow-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid #dbdbdb; flex-shrink: 0; }
        .follow-info { flex: 1; min-width: 0; }
        .follow-username {
            font-size: 14px; font-weight: 700; color: #262626;
            text-decoration: none; display: block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .follow-username:hover { text-decoration: underline; }
        .follow-subname { font-size: 13px; color: #8e8e8e; }
        .btn-following {
            padding: 6px 16px; background: #efefef; color: #262626;
            border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
            font-family: 'Instrument Sans', sans-serif; cursor: pointer; flex-shrink: 0;
            transition: background 0.15s;
        }
        .btn-following:hover { background: #dbdbdb; }
        .empty-state { text-align: center; padding: 48px 20px; color: #8e8e8e; font-size: 14px; }
        .empty-icon { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="page-wrap">
    <div class="card">
        <div class="card-header">
            <a onclick="history.back()" class="card-back">←</a>
            <span class="card-title">팔로잉</span>
        </div>

        <div th:if="${following != null and !#lists.isEmpty(following)}">
            <div class="follow-item"
                 th:each="follow : ${following}"
                 th:data-user-id="${follow.userId}">
                <img th:src="${follow.profileImgUrl != null} ? '/upload/' + ${follow.profileImgUrl} : '/images/default_profile.png'"
                     class="follow-avatar" alt="프로필"
                     onerror="this.src='/images/default_profile.png'">
                <div class="follow-info">
                    <a th:href="@{/profile/{id}(id=${follow.snapiaId})}"
                       class="follow-username" th:text="${follow.snapiaId}">username</a>
                    <div class="follow-subname" th:text="${follow.snapiaId}"></div>
                </div>
                <button th:if="${follow.equalUserState == 0}"
                        class="btn-following"
                        th:onclick="'unfollow(this, ' + ${follow.userId} + ')'">
                    팔로잉
                </button>
            </div>
        </div>

        <div th:if="${following == null or #lists.isEmpty(following)}" class="empty-state">
            <div class="empty-icon">👤</div>
            <p>팔로잉이 없습니다</p>
        </div>
    </div>
</div>

<script>
    function unfollow(btn, userId) {
        if (!confirm('언팔로우하시겠습니까?')) return;
        fetch(`/follow/${userId}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' } })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const item = btn.closest('.follow-item');
                    item.style.transition = 'opacity 0.25s';
                    item.style.opacity = '0';
                    setTimeout(() => {
                        item.remove();
                        if (!document.querySelectorAll('.follow-item').length) location.reload();
                    }, 250);
                } else { alert(data.message); }
            })
            .catch(() => alert('오류가 발생했습니다.'));
    }
</script>
<th:block th:replace="~{fragments/header :: headerScript}"></th:block>
</body>
</html>
