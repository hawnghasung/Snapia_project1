<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팔로워 - Snapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/header :: headerStyles}"></th:block>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
        }

        .page-wrap { max-width: 480px; margin: 80px auto 40px; padding: 0 16px; }

        .card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            overflow: hidden;
        }
        .card-header {
            padding: 14px 16px;
            border-bottom: 1px solid #efefef;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .card-title { font-size: 15px; font-weight: 700; color: #262626; }
        .card-back {
            position: absolute;
            left: 14px;
            font-size: 20px;
            cursor: pointer;
            color: #262626;
            text-decoration: none;
            line-height: 1;
        }
        .card-back:hover { opacity: 0.6; }

        .follow-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 12px;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.1s;
        }
        .follow-item:last-child { border-bottom: none; }
        .follow-item:hover { background: #fafafa; }

        .follow-avatar {
            width: 44px; height: 44px;
            border-radius: 50%; object-fit: cover;
            border: 1px solid #dbdbdb; flex-shrink: 0;
        }
        .follow-info { flex: 1; min-width: 0; }
        .follow-username {
            font-size: 14px; font-weight: 700; color: #262626;
            text-decoration: none; display: block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .follow-username:hover { text-decoration: underline; }
        .follow-subname { font-size: 13px; color: #8e8e8e; }

        .btn-follow {
            padding: 6px 16px;
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Instrument Sans', sans-serif;
            cursor: pointer;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }
        .btn-follow:hover { opacity: 0.85; }
        .btn-follow.following {
            background: #efefef;
            color: #262626;
        }
        .btn-follow.following:hover { background: #dbdbdb; }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #8e8e8e;
            font-size: 14px;
        }
        .empty-icon { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="page-wrap">
    <div class="card">
        <div class="card-header">
            <a onclick="history.back()" class="card-back">←</a>
            <span class="card-title">팔로워</span>
        </div>

        <div th:if="${followers != null and !#lists.isEmpty(followers)}">
            <div class="follow-item"
                 th:each="follower : ${followers}"
                 th:data-user-id="${follower.userId}">
                <img th:src="${follower.profileImgUrl != null} ? '/upload/' + ${follower.profileImgUrl} : '/images/default_profile.png'"
                     class="follow-avatar" alt="프로필"
                     onerror="this.src='/images/default_profile.png'">
                <div class="follow-info">
                    <a th:href="@{/profile/{id}(id=${follower.snapiaId})}"
                       class="follow-username" th:text="${follower.snapiaId}">username</a>
                    <div class="follow-subname" th:text="${follower.snapiaId}"></div>
                </div>
                <button th:if="${follower.equalUserState == 0}"
                        th:class="${follower.followState == 1} ? 'btn-follow following' : 'btn-follow'"
                        th:text="${follower.followState == 1} ? '팔로잉' : '팔로우'"
                        th:onclick="'toggleFollow(this, ' + ${follower.userId} + ')'">
                    팔로우
                </button>
            </div>
        </div>

        <div th:if="${followers == null or #lists.isEmpty(followers)}" class="empty-state">
            <div class="empty-icon">👥</div>
            <p>팔로워가 없습니다</p>
        </div>
    </div>
</div>

<script>
    function toggleFollow(btn, userId) {
        const isFollowing = btn.classList.contains('following');
        if (isFollowing && !confirm('언팔로우하시겠습니까?')) return;
        const method = isFollowing ? 'DELETE' : 'POST';
        fetch(`/follow/${userId}`, { method, headers: { 'Content-Type': 'application/json' } })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    if (isFollowing) { btn.classList.remove('following'); btn.textContent = '팔로우'; }
                    else { btn.classList.add('following'); btn.textContent = '팔로잉'; }
                } else { alert(data.message); }
            })
            .catch(() => alert('오류가 발생했습니다.'));
    }
</script>
<th:block th:replace="~{fragments/header :: headerScript}"></th:block>
</body>
</html>
