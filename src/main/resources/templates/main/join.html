<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원가입</title>
</head>
<body>
<h2>회원가입</h2>
<form th:action="@{/join}" th:object="${userDTO}" method="post">
    <div>
        <label>아이디:</label>
        <input type="text" th:field="*{snapiaId}" placeholder="아이디 입력">
        <p th:if="${#fields.hasErrors('snapiaId')}" th:errors="*{snapiaId}"></p>
    </div>
    <div>
        <label>비밀번호:</label>
        <input type="password" th:field="*{password}" placeholder="비밀번호 입력">
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>
    <div>
        <label>이름:</label>
        <input type="text" th:field="*{name}">
    </div>
    <div>
        <label>이메일:</label>
        <input type="email" th:field="*{email}">
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>
    <div>
        <label>전화번호:</label>
        <input type="text" th:field="*{phoneNum}">
    </div>
    <button type="submit">가입하기</button>
</form>
</body>
</html>
