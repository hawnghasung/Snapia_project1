<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시물 작성 - Snapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <th:block th:replace="~{fragments/header :: headerStyles}"></th:block>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50">

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="mt-20 max-w-xl mx-auto px-5 py-8">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="px-5 py-4 border-b border-gray-200">
            <span class="text-base font-semibold text-gray-800">새 게시물 만들기</span>
        </div>

        <form th:action="@{/post}" method="post" enctype="multipart/form-data">
            <div class="p-6 flex flex-col gap-5">
                <!-- 이미지/동영상 업로드 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wide mb-2">사진 / 동영상</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all"
                         onclick="document.getElementById('fileInput').click()">
                        <div class="text-4xl mb-2" id="uploadIcon">🖼️</div>
                        <div class="text-sm text-gray-500" id="uploadText">클릭하여 사진 또는 동영상 선택</div>
                        <div class="text-xs text-gray-400 mt-1">사진: JPG, PNG, GIF | 동영상: MP4, MOV (최대 60초)</div>
                    </div>
                    <input type="file" id="fileInput" name="multipartFile" accept="image/*,video/*" class="hidden" onchange="previewMedia(event)">
                    <!-- 이미지 미리보기 -->
                    <img id="previewImg" class="hidden w-full max-h-72 object-contain rounded-lg mt-3" alt="미리보기">
                    <!-- 동영상 미리보기 -->
                    <video id="previewVideo" class="hidden w-full max-h-72 rounded-lg mt-3" controls playsinline></video>
                    <!-- 파일 정보 -->
                    <div id="fileInfo" class="hidden mt-2 text-xs text-gray-500 text-center"></div>
                </div>

                <!-- 내용 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wide mb-2">내용</label>
                    <textarea name="content" rows="5"
                              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-800 resize-none outline-none focus:border-gray-400 transition-colors placeholder-gray-400"
                              placeholder="문구를 입력하세요..." required></textarea>
                </div>

                <!-- 공개 여부 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wide mb-2">공개 여부</label>
                    <select name="pubOrNot"
                            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-800 bg-white outline-none focus:border-gray-400 transition-colors">
                        <option value="PUB">🌐 공개</option>
                        <option value="PRIVATE">🔒 비공개</option>
                    </select>
                </div>

                <!-- 해시태그 -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wide mb-2">해시태그</label>
                    <div class="flex gap-2">
                        <input type="text" id="hashtagInput"
                               class="flex-1 px-3 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-800 outline-none focus:border-gray-400 transition-colors placeholder-gray-400"
                               placeholder="#태그 입력 후 Enter">
                        <button type="button" onclick="addHashtag()"
                                class="px-4 py-2 text-sm font-semibold text-white bg-gray-700 hover:bg-gray-800 rounded-lg transition-colors">추가</button>
                    </div>
                    <div id="hashtagList" class="flex flex-wrap gap-2 mt-2"></div>
                    <div id="hashtagHiddenInputs"></div>
                </div>
            </div>

            <div class="px-6 py-4 border-t border-gray-200 flex gap-2 justify-end">
                <a href="/post/my"
                   class="px-4 py-2 text-sm font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">취소</a>
                <button type="submit"
                        class="px-4 py-2 text-sm font-semibold text-white bg-blue-500 hover:bg-blue-600 rounded-lg transition-colors">공유하기</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ── 미디어 미리보기 ─────────────────────────────
    function previewMedia(event) {
        const file = event.target.files[0];
        if (!file) return;

        const img   = document.getElementById('previewImg');
        const video = document.getElementById('previewVideo');
        const info  = document.getElementById('fileInfo');
        const icon  = document.getElementById('uploadIcon');
        const text  = document.getElementById('uploadText');

        img.classList.add('hidden');
        video.classList.add('hidden');

        const sizeMB = (file.size / 1024 / 1024).toFixed(1);

        if (file.type.startsWith('video/')) {
            video.src = URL.createObjectURL(file);
            video.classList.remove('hidden');
            icon.textContent = '🎬';
            text.textContent = file.name;
            video.onloadedmetadata = () => {
                const duration = Math.floor(video.duration);
                if (duration > 60) {
                    info.textContent = `⚠️ 동영상이 ${duration}초입니다. 60초 이하만 업로드 가능합니다.`;
                    info.style.color = '#ef4444';
                } else {
                    info.textContent = `✅ ${duration}초 · ${sizeMB}MB`;
                    info.style.color = '#6b7280';
                }
                info.classList.remove('hidden');
            };
        } else {
            const reader = new FileReader();
            reader.onload = e => {
                img.src = e.target.result;
                img.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
            icon.textContent = '🖼️';
            text.textContent = file.name;
            info.textContent = `📁 ${sizeMB}MB`;
            info.classList.remove('hidden');
            info.style.color = '#6b7280';
        }
    }

    // ── 해시태그 ────────────────────────────────────
    const hashtags = [];
    let hashtagTimeout;

    function addHashtag(tagValue) {
        const input = document.getElementById('hashtagInput');
        let tag = (tagValue || input.value).trim();
        if (!tag) return;
        if (!tag.startsWith('#')) tag = '#' + tag;
        tag = tag.split(' ')[0];
        if (hashtags.includes(tag)) { input.value = ''; closeHashtagDropdown(); return; }
        hashtags.push(tag);
        renderHashtags();
        input.value = '';
        closeHashtagDropdown();
    }

    function removeHashtag(tag) {
        const idx = hashtags.indexOf(tag);
        if (idx > -1) hashtags.splice(idx, 1);
        renderHashtags();
    }

    function renderHashtags() {
        const list = document.getElementById('hashtagList');
        const hiddens = document.getElementById('hashtagHiddenInputs');
        list.innerHTML = hashtags.map(tag => `
            <span class="inline-flex items-center gap-1 px-3 py-1 bg-blue-50 text-blue-600 text-sm rounded-full border border-blue-200">
                ${tag}
                <button type="button" onclick="removeHashtag('${tag}')" class="text-blue-400 hover:text-blue-600 font-bold leading-none">×</button>
            </span>
        `).join('');
        hiddens.innerHTML = hashtags.map(tag =>
            `<input type="hidden" name="hashtags" value="${tag.replace('#', '')}">`
        ).join('');
    }

    // 자동완성 드롭다운
    function closeHashtagDropdown() {
        const dd = document.getElementById('hashtagDropdown');
        if (dd) dd.remove();
    }

    function showHashtagDropdown(tags) {
        closeHashtagDropdown();
        if (!tags || tags.length === 0) return;
        const input = document.getElementById('hashtagInput');
        const wrapper = input.parentElement.parentElement;

        const dd = document.createElement('div');
        dd.id = 'hashtagDropdown';
        dd.className = 'absolute bg-white border border-gray-200 rounded-lg shadow-lg z-50 w-full mt-1 overflow-hidden';
        dd.style.top = input.parentElement.offsetTop + input.parentElement.offsetHeight + 'px';

        tags.forEach(tag => {
            const item = document.createElement('div');
            item.className = 'px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer flex items-center gap-2';
            item.innerHTML = `<span class="text-blue-500 font-semibold">#</span>${tag}`;
            item.onclick = () => addHashtag(tag);
            dd.appendChild(item);
        });

        wrapper.style.position = 'relative';
        wrapper.appendChild(dd);
    }

    document.getElementById('hashtagInput').addEventListener('input', function() {
        const val = this.value.trim().replace(/^#/, '');
        clearTimeout(hashtagTimeout);
        if (!val) { closeHashtagDropdown(); return; }
        hashtagTimeout = setTimeout(async () => {
            try {
                const res = await fetch(`/hashtag/search?keyword=${encodeURIComponent(val)}`);
                const tags = await res.json();
                showHashtagDropdown(tags);
            } catch(e) { closeHashtagDropdown(); }
        }, 250);
    });

    document.getElementById('hashtagInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addHashtag(); }
    });

    document.addEventListener('click', function(e) {
        if (!document.getElementById('hashtagInput').contains(e.target)) closeHashtagDropdown();
    });
</script>

<th:block th:replace="~{noti :: notiScript}"></th:block>
<th:block th:replace="~{fragments/header :: headerScript}"></th:block>
</body>
</html>
