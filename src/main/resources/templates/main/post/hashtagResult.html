<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'#' + ${tag} + ' - Snapia'">해시태그 - Snapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <th:block th:replace="~{fragments/header :: headerStyles}"></th:block>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; overflow: hidden; }

        /* 릴스 컨테이너 */
        .reels-wrapper { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
        .reels-container { width: 100%; max-width: 420px; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .reels-container::-webkit-scrollbar { display: none; }

        /* 릴 카드 */
        .reel-card { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .reel-media { width: 100%; height: 100%; object-fit: cover; }
        .reel-media-img { width: 100%; height: 100%; object-fit: cover; }

        /* 오버레이 */
        .reel-overlay { position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,0.6) 100%); pointer-events: none; }

        /* 좌측 하단 정보 */
        .reel-info { position: absolute; bottom: 80px; left: 16px; right: 70px; z-index: 10; }
        .reel-user { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
        .reel-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
        .reel-username { font-size: 14px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .reel-caption { font-size: 13px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .reel-caption.expanded { -webkit-line-clamp: unset; }
        .reel-tags { display: flex; flex-wrap: wrap; gap: 4px; }
        .reel-tag { font-size: 12px; color: #a8d8ff; font-weight: 500; cursor: pointer; }

        /* 우측 액션 버튼 */
        .reel-actions { position: absolute; bottom: 80px; right: 12px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .reel-action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: none; border: none; color: #fff; }
        .reel-action-btn span.icon { font-size: 26px; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
        .reel-action-btn span.count { font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

        /* 헤더 태그 */
        .reel-header { position: absolute; top: 0; left: 0; right: 0; padding: 16px; display: flex; align-items: center; gap: 12px; z-index: 10; background: linear-gradient(rgba(0,0,0,0.4), transparent); }
        .reel-header-back { font-size: 22px; cursor: pointer; color: #fff; background: none; border: none; }
        .reel-header-tag { font-size: 16px; font-weight: 700; color: #fff; }
        .reel-header-count { font-size: 13px; color: rgba(255,255,255,0.7); }

        /* 빈 상태 */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }

        /* 네비게이션 힌트 */
        .scroll-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.4); font-size: 12px; z-index: 20; pointer-events: none; }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="reels-wrapper" style="margin-top:0; top:0;">

    <!-- 게시물 없음 -->
    <div th:if="${posts == null or #lists.isEmpty(posts)}" class="empty-state">
        <div style="font-size:48px;">#</div>
        <p style="font-size:18px; font-weight:600;">#<span th:text="${tag}"></span></p>
        <p style="font-size:14px; color:rgba(255,255,255,0.5);">게시물이 없습니다</p>
        <button onclick="history.back()" style="margin-top:8px; padding:10px 24px; background:#0095f6; border:none; border-radius:8px; color:#fff; font-size:14px; font-weight:600; cursor:pointer;">돌아가기</button>
    </div>

    <!-- 릴스 -->
    <div th:if="${posts != null and !#lists.isEmpty(posts)}" class="reels-container" id="reelsContainer">

        <div th:each="post, stat : ${posts}" class="reel-card"
             th:data-pid="${post.pid}"
             th:data-snapia-id="${post.userSnapiaId}">

            <!-- 헤더 (첫 번째 카드에만) -->
            <div th:if="${stat.first}" class="reel-header">
                <button class="reel-header-back" onclick="history.back()">←</button>
                <div>
                    <div class="reel-header-tag">#<span th:text="${tag}"></span></div>
                    <div class="reel-header-count" th:text="${#lists.size(posts)} + '개의 게시물'"></div>
                </div>
            </div>

            <!-- 미디어 -->
            <video th:if="${post.mediaType == 'VIDEO'}"
                   class="reel-media"
                   th:src="@{'/upload/' + ${post.postImgUrl}}"
                   th:poster="@{'/upload/' + ${post.thumbnailUrl}}"
                   loop playsinline preload="none"
                   onclick="togglePlay(this)"></video>
            <img th:if="${post.mediaType != 'VIDEO'}"
                 class="reel-media-img"
                 th:src="@{'/upload/' + ${post.postImgUrl}}"
                 alt="게시물">

            <!-- 오버레이 -->
            <div class="reel-overlay"></div>

            <!-- 좌측 하단 -->
            <div class="reel-info">
                <div class="reel-user" onclick="goToProfile(this)">
                    <img class="reel-avatar"
                         th:src="${post.userProfileImageUrl != null} ? '/upload/' + ${post.userProfileImageUrl} : 'https://i.pravatar.cc/150?u=default'"
                         alt="프로필">
                    <span class="reel-username" th:text="${post.userSnapiaId}">username</span>
                </div>
                <div class="reel-caption" th:text="${post.content}" onclick="this.classList.toggle('expanded')"></div>
                <div class="reel-tags">
                    <span th:each="ht : ${post.hashtagList}"
                          class="reel-tag"
                          th:text="'#' + ${ht}"
                          th:data-tag="${ht}"
                          onclick="goToTag(this)"></span>
                </div>
            </div>

            <!-- 우측 액션 -->
            <div class="reel-actions">
                <button class="reel-action-btn" th:data-pid="${post.pid}" onclick="toggleLike(this)">
                    <span class="icon" th:text="${post.liked} ? '❤️' : '🤍'">🤍</span>
                    <span class="count" th:text="${post.likeCount ?: 0}">0</span>
                </button>
                <button class="reel-action-btn" th:data-pid="${post.pid}" onclick="goToPost(this)">
                    <span class="icon">💬</span>
                    <span class="count" th:text="${post.commentCount ?: 0}">0</span>
                </button>
                <button class="reel-action-btn" th:data-pid="${post.pid}" onclick="goToPost(this)">
                    <span class="icon">↗️</span>
                </button>
            </div>

        </div>
    </div>

    <div class="scroll-hint" id="scrollHint">↑↓ 스크롤하여 탐색</div>
</div>

<script th:inline="javascript">
    // 스크롤 힌트 3초 후 숨기기
    setTimeout(() => {
        const hint = document.getElementById('scrollHint');
        if (hint) hint.style.opacity = '0';
    }, 3000);

    // 비디오 자동재생 - IntersectionObserver
    const videos = document.querySelectorAll('.reel-media');
    if (videos.length > 0) {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                    video.currentTime = 0;
                }
            });
        }, { threshold: 0.7 });

        videos.forEach(v => observer.observe(v));
    }

    function togglePlay(video) {
        if (video.paused) video.play();
        else video.pause();
    }

    function goToProfile(el) {
        const card = el.closest('.reel-card');
        location.href = '/profile/' + card.dataset.snapiaId;
    }

    function goToPost(btn) {
        location.href = '/post/' + btn.dataset.pid;
    }

    function goToTag(el) {
        location.href = '/post/hashtag/result?tag=' + el.dataset.tag;
    }

    async function toggleLike(btn) {
        const pid = btn.dataset.pid;
        try {
            const res = await fetch(`/post/${pid}/like`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            const data = await res.json();
            btn.querySelector('.icon').textContent = data.isLiked ? '❤️' : '🤍';
            btn.querySelector('.count').textContent = data.likeCount;
        } catch(e) { console.error(e); }
    }
</script>

<th:block th:replace="~{noti :: notiScript}"></th:block>
<th:block th:replace="~{fragments/header :: headerScript}"></th:block>
</body>
</html>
