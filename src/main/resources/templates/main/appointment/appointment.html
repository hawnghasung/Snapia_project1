<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 - Snapia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/header :: headerStyles}"></th:block>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: #f5f5f0;
            min-height: 100vh;
        }

        .page-wrap {
            max-width: 900px;
            margin: 88px auto 60px;
            padding: 0 20px;
        }

        /* 페이지 제목 */
        .page-title {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }

        /* 탭 바 */
        .tab-bar {
            display: flex;
            gap: 4px;
            background: #fff;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 24px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.06);
            width: fit-content;
        }

        .tab-item {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            border: none;
            background: none;
            font-family: 'DM Sans', sans-serif;
        }
        .tab-item:hover { color: #1a1a1a; }
        .tab-item.active {
            background: #1a1a1a;
            color: #fff;
        }

        /* 탭 패널 */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── 캘린더 ── */
        .cal-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 16px;
        }

        .cal-nav-btn {
            width: 34px; height: 34px;
            border: 1px solid #ddd; border-radius: 50%;
            background: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; color: #1a1a1a;
        }
        .cal-nav-btn:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

        .cal-month-label {
            font-size: 15px; font-weight: 600; color: #1a1a1a;
            min-width: 130px; text-align: center;
        }

        .cal-today-btn {
            padding: 6px 14px; border: 1px solid #ddd; border-radius: 20px;
            background: #fff; font-size: 12px; font-weight: 500;
            font-family: 'DM Sans', sans-serif; cursor: pointer;
            transition: all 0.15s; color: #1a1a1a;
        }
        .cal-today-btn:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

        .cal-grid-wrap {
            background: #fff; border-radius: 16px; overflow: hidden;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
        }

        .cal-weekdays {
            display: grid; grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid #f0f0f0;
        }

        .cal-weekday {
            padding: 12px 0; text-align: center;
            font-size: 11px; font-weight: 600; color: #aaa;
            letter-spacing: 0.5px; text-transform: uppercase;
        }
        .cal-weekday:first-child { color: #e55; }
        .cal-weekday:last-child { color: #59f; }

        .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }

        .cal-day {
            min-height: 90px; padding: 8px 6px 6px;
            border-right: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0;
            position: relative; transition: background 0.1s;
        }
        .cal-day:nth-child(7n) { border-right: none; }
        .cal-day:hover { background: #fafaf8; }
        .cal-day.other-month .day-num { color: #ccc; }
        .cal-day.today .day-num {
            background: #1a1a1a; color: #fff; border-radius: 50%;
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
        }
        .cal-day.sunday .day-num { color: #e55; }
        .cal-day.saturday .day-num { color: #59f; }

        .day-num {
            font-size: 12px; font-weight: 500; color: #1a1a1a;
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 3px;
        }

        .ap-event {
            background: #1a1a1a; color: #fff;
            font-size: 10px; font-weight: 500;
            padding: 2px 6px; border-radius: 3px; margin-bottom: 2px;
            cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: all 0.15s; position: relative;
        }
        .ap-event:hover { background: #333; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

        .ap-event .tooltip {
            display: none; position: absolute;
            bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
            background: #1a1a1a; color: #fff; font-size: 11px;
            padding: 8px 12px; border-radius: 8px; white-space: nowrap;
            z-index: 200; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            pointer-events: none; line-height: 1.6; min-width: 160px;
        }
        .ap-event .tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            border: 5px solid transparent; border-top-color: #1a1a1a;
        }
        .ap-event:hover .tooltip { display: block; }

        /* ── 예약 목록 (요청/현황) ── */
        .list-wrap { display: flex; flex-direction: column; gap: 1px; }

        .filter-bar {
            display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
        }
        .filter-chip {
            padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
            border: 1px solid #ddd; background: #fff; color: #999; cursor: pointer; transition: all 0.15s;
            font-family: 'DM Sans', sans-serif;
        }
        .filter-chip:hover { border-color: #1a1a1a; color: #1a1a1a; }
        .filter-chip.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

        .ap-card {
            background: #fff; border-radius: 12px; padding: 16px;
            display: flex; align-items: center; gap: 14px;
            transition: all 0.15s; cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .ap-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-1px); }

        .ap-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            object-fit: cover; border: 1px solid #eee; flex-shrink: 0;
        }

        .ap-info { flex: 1; min-width: 0; }
        .ap-name { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; display: flex; align-items: center; gap: 8px; }
        .ap-time { font-size: 12px; color: #aaa; }

        .status-badge {
            display: inline-flex; align-items: center;
            padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; flex-shrink: 0;
        }
        .status-badge.wait  { background: #fff8e1; color: #f59e0b; }
        .status-badge.accept { background: #e8f5e9; color: #2e7d32; }
        .status-badge.decline { background: #fce4e4; color: #c62828; }
        .status-badge.cancel { background: #f5f5f5; color: #999; }
        .status-badge.suggested { background: #f3e8ff; color: #7c3aed; }

        .ap-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-accept {
            padding: 6px 12px; background: #1a1a1a; color: #fff;
            border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
            font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.15s;
        }
        .btn-accept:hover { opacity: 0.75; }
        .btn-reject {
            padding: 6px 12px; background: #fff; color: #1a1a1a;
            border: 1px solid #ddd; border-radius: 8px; font-size: 12px; font-weight: 600;
            font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.15s;
        }
        .btn-reject:hover { background: #f5f5f5; }
        .btn-suggest {
            padding: 6px 12px; background: #fff; color: #7c3aed;
            border: 1px solid #c4b5fd; border-radius: 8px; font-size: 12px; font-weight: 600;
            font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.15s;
        }
        .btn-suggest:hover { background: #faf5ff; }

        /* 빈 상태 */
        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty-icon { font-size: 44px; margin-bottom: 12px; opacity: 0.3; }
        .empty-state p { font-size: 14px; }

        /* 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 9999;
            align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: #fff; border-radius: 20px; width: 100%; max-width: 380px;
            overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-top { background: #1a1a1a; padding: 24px; color: #fff; position: relative; }
        .modal-date { font-family: 'DM Serif Display', serif; font-size: 28px; letter-spacing: -1px; margin-bottom: 4px; }
        .modal-sub { font-size: 13px; color: rgba(255,255,255,0.55); }
        .modal-close {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center; transition: background 0.15s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.25); }

        .modal-body { padding: 16px 20px 20px; }
        .modal-row {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px;
        }
        .modal-row:last-child { border-bottom: none; }
        .modal-row-icon {
            width: 34px; height: 34px; background: #f5f5f0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #1a1a1a;
        }
        .modal-row-label { font-size: 10px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .modal-row-value { font-size: 13px; font-weight: 500; color: #1a1a1a; }

        .modal-footer { padding: 12px 20px 20px; display: flex; gap: 8px; }
        .modal-btn {
            flex: 1; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600;
            font-family: 'DM Sans', sans-serif; cursor: pointer; border: 1px solid #ddd;
            background: #fff; color: #1a1a1a; transition: all 0.15s;
        }
        .modal-btn:hover { background: #f5f5f5; }
        .modal-btn.danger { color: #c62828; border-color: rgba(198,40,40,0.25); }
        .modal-btn.danger:hover { background: rgba(198,40,40,0.05); }
        .modal-btn.primary { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
        .modal-btn.primary:hover { opacity: 0.8; background: #1a1a1a; }
        .modal-btn.purple { color: #7c3aed; border-color: #c4b5fd; }
        .modal-btn.purple:hover { background: #faf5ff; }

        .suggest-banner {
            background: #f3e8ff; border: 1px solid #c4b5fd; border-radius: 8px;
            padding: 10px 12px; margin-top: 4px; font-size: 12px; color: #7c3aed; font-weight: 600;
        }
        .suggest-banner .suggest-time { font-size: 14px; font-weight: 700; color: #6d28d9; margin-top: 3px; }

        /* 거절/역제안 모달 */
        .sub-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 10000;
            align-items: center; justify-content: center; padding: 20px;
        }
        .sub-modal-overlay.active { display: flex; }
        .sub-modal {
            background: #fff; border-radius: 16px; width: 100%; max-width: 340px;
            overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .sub-modal-header {
            padding: 16px 20px; border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .sub-modal-title { font-size: 15px; font-weight: 700; color: #1a1a1a; }
        .sub-modal-body { padding: 16px 20px; }
        .sub-modal-input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none;
            resize: none; background: #fafaf8;
        }
        .sub-modal-input:focus { border-color: #1a1a1a; background: #fff; }
        .sub-modal-footer { padding: 12px 20px; border-top: 1px solid #f0f0f0; display: flex; gap: 8px; }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="page-wrap">
    <h1 class="page-title">예약</h1>

    <!-- 탭 바 -->
    <div class="tab-bar">
        <button class="tab-item active" onclick="switchTab('calendar', this)">📅 캘린더</button>
        <button class="tab-item" th:if="${isBusiness}" onclick="switchTab('requests', this)">📋 받은 요청</button>
        <button class="tab-item" th:if="${!isBusiness}" onclick="switchTab('mylist', this)">📋 내 예약 현황</button>
    </div>

    <!-- ── 탭 1: 캘린더 ── -->
    <div class="tab-panel active" id="tab-calendar">
        <div class="cal-header">
            <button class="cal-today-btn" onclick="goToday()">오늘</button>
            <button class="cal-nav-btn" onclick="prevMonth()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span class="cal-month-label" id="monthLabel"></span>
            <button class="cal-nav-btn" onclick="nextMonth()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>
        <div class="cal-grid-wrap">
            <div class="cal-weekdays">
                <div class="cal-weekday">Sun</div>
                <div class="cal-weekday">Mon</div>
                <div class="cal-weekday">Tue</div>
                <div class="cal-weekday">Wed</div>
                <div class="cal-weekday">Thu</div>
                <div class="cal-weekday">Fri</div>
                <div class="cal-weekday">Sat</div>
            </div>
            <div class="cal-days" id="calDays"></div>
        </div>
    </div>

    <!-- ── 탭 2-A: 비즈니스 받은 요청 ── -->
    <div class="tab-panel" id="tab-requests">
        <div class="filter-bar">
            <button class="filter-chip active" data-filter="ALL" onclick="setFilter('ALL', this, 'biz')">전체</button>
            <button class="filter-chip" data-filter="WAIT" onclick="setFilter('WAIT', this, 'biz')">대기중</button>
            <button class="filter-chip" data-filter="ACCEPT" onclick="setFilter('ACCEPT', this, 'biz')">승인됨</button>
            <button class="filter-chip" data-filter="DECLINE" onclick="setFilter('DECLINE', this, 'biz')">거절됨</button>
        </div>
        <div class="list-wrap" id="bizList"></div>
    </div>

    <!-- ── 탭 2-B: 일반 유저 내 예약 현황 ── -->
    <div class="tab-panel" id="tab-mylist">
        <div class="filter-bar">
            <button class="filter-chip active" data-filter="ALL" onclick="setFilter('ALL', this, 'guest')">전체</button>
            <button class="filter-chip" data-filter="WAIT" onclick="setFilter('WAIT', this, 'guest')">대기중</button>
            <button class="filter-chip" data-filter="ACCEPT" onclick="setFilter('ACCEPT', this, 'guest')">승인됨</button>
            <button class="filter-chip" data-filter="DECLINE" onclick="setFilter('DECLINE', this, 'guest')">거절됨</button>
            <button class="filter-chip" data-filter="SUGGESTED" onclick="setFilter('SUGGESTED', this, 'guest')">역제안</button>
        </div>
        <div class="list-wrap" id="guestList"></div>
    </div>
</div>

<!-- 상세 모달 -->
<div id="detailModal" class="modal-overlay" onclick="closeModalOutside(event)">
    <div class="modal">
        <div class="modal-top">
            <div class="modal-date" id="modalDate">-</div>
            <div class="modal-sub" id="modalSub">-</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<!-- 거절 사유 모달 -->
<div id="rejectModal" class="sub-modal-overlay">
    <div class="sub-modal">
        <div class="sub-modal-header">
            <span class="sub-modal-title">거절 사유</span>
            <button class="modal-close" style="position:static; background:#f5f5f5; color:#1a1a1a;" onclick="closeRejectModal()">✕</button>
        </div>
        <div class="sub-modal-body">
            <textarea id="rejectReason" class="sub-modal-input" rows="3" placeholder="거절 사유 (선택)"></textarea>
        </div>
        <div class="sub-modal-footer">
            <button class="modal-btn" onclick="closeRejectModal()">취소</button>
            <button class="modal-btn danger" onclick="confirmReject()">거절하기</button>
        </div>
    </div>
</div>

<!-- 역제안 모달 -->
<div id="suggestModal" class="sub-modal-overlay">
    <div class="sub-modal">
        <div class="sub-modal-header">
            <span class="sub-modal-title">역제안 보내기</span>
            <button class="modal-close" style="position:static; background:#f5f5f5; color:#1a1a1a;" onclick="closeSuggestModal()">✕</button>
        </div>
        <div class="sub-modal-body">
            <p style="font-size:12px; color:#aaa; margin-bottom:10px;">다른 시간을 제안합니다.</p>
            <input type="datetime-local" id="suggestTime" class="sub-modal-input">
        </div>
        <div class="sub-modal-footer">
            <button class="modal-btn" onclick="closeSuggestModal()">취소</button>
            <button class="modal-btn purple" onclick="confirmSuggest()">역제안 보내기</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const currentUid = [[${currentUid}]];
    const isBusiness = [[${isBusiness}]];
    const bpid = [[${bpid != null ? bpid : 0}]];

    const WEEKDAYS = ['일','월','화','수','목','금','토'];
    const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

    const STATUS_MAP = {
        WAIT:      { text: '대기중',  cls: 'wait' },
        ACCEPT:    { text: '승인됨',  cls: 'accept' },
        DECLINE:   { text: '거절됨',  cls: 'decline' },
        CANCEL:    { text: '취소됨',  cls: 'cancel' },
        SUGGESTED: { text: '역제안',  cls: 'suggested' },
    };

    function statusBadge(s) {
        const i = STATUS_MAP[s] || { text: s, cls: 'wait' };
        return `<span class="status-badge ${i.cls}">${i.text}</span>`;
    }

    function fmtDateTime(dt) {
        if (!dt) return '-';
        const d = new Date(dt);
        return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }

    function fmtTime(dt) {
        if (!dt) return '';
        const d = new Date(dt);
        return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }

    // ── 탭 전환 ──
    function switchTab(name, el) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        el.classList.add('active');
    }

    // ── 데이터 로드 ──
    let confirmedList = [];
    let bizList = [], guestList = [];
    let bizFilter = 'ALL', guestFilter = 'ALL';

    async function loadAll() {
        const [confirmed, list] = await Promise.all([
            fetch(`/appointment/a/confirmed?uid=${currentUid}&isBusiness=${isBusiness}`).then(r => r.json()),
            isBusiness
                ? fetch(`/appointment/a/business?uid=${bpid}`).then(r => r.json())
                : fetch(`/appointment/a/guest?uid=${currentUid}`).then(r => r.json())
        ]);
        confirmedList = confirmed;
        if (isBusiness) { bizList = list; renderBizList(); }
        else { guestList = list; renderGuestList(); }
        renderCalendar();
    }

    // ── 필터 ──
    function setFilter(f, el, type) {
        const bar = el.parentElement;
        bar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        if (type === 'biz') { bizFilter = f; renderBizList(); }
        else { guestFilter = f; renderGuestList(); }
    }

    // ── 비즈니스 목록 렌더 ──
    function renderBizList() {
        const filtered = bizFilter === 'ALL' ? bizList : bizList.filter(a => a.appointmentStatus === bizFilter);
        const container = document.getElementById('bizList');
        if (!filtered.length) { container.innerHTML = emptyHtml('받은 예약 요청이 없습니다.'); return; }
        container.innerHTML = filtered.map(ap => {
            const isPending = ap.appointmentStatus === 'WAIT';
            const actions = isPending
                ? `<div class="ap-actions">
                    <button class="btn-accept" onclick="event.stopPropagation();acceptAp(${ap.aid})">수락</button>
                    <button class="btn-suggest" onclick="event.stopPropagation();openSuggest(${ap.aid})">역제안</button>
                    <button class="btn-reject" onclick="event.stopPropagation();openReject(${ap.aid})">거절</button>
                   </div>`
                : statusBadge(ap.appointmentStatus);
            return `
            <div class="ap-card" onclick="openDetail(${ap.aid})">
                <img src="https://i.pravatar.cc/44?u=${ap.requester_id}" class="ap-avatar" alt="">
                <div class="ap-info">
                    <div class="ap-name">${ap.requesterSnapiaId}(${ap.requesterName})</div>
                    <div class="ap-time">${fmtDateTime(ap.requestTime)}</div>
                </div>
                ${actions}
            </div>`;
        }).join('');
    }

    // ── 게스트 목록 렌더 ──
    function renderGuestList() {
        const filtered = guestFilter === 'ALL' ? guestList : guestList.filter(a => a.appointmentStatus === guestFilter);
        const container = document.getElementById('guestList');
        if (!filtered.length) { container.innerHTML = emptyHtml('예약 내역이 없습니다.'); return; }
        container.innerHTML = filtered.map(ap => {
            const suggestLine = ap.appointmentStatus === 'SUGGESTED' && ap.suggestTime
                ? `<div class="ap-time" style="color:#7c3aed; font-weight:600;">📩 제안: ${fmtDateTime(ap.suggestTime)}</div>` : '';
            return `
            <div class="ap-card" onclick="openDetail(${ap.aid})">
                <img src="https://i.pravatar.cc/44?u=biz${ap.businessProfile_id}" class="ap-avatar" alt="">
                <div class="ap-info">
                    <div class="ap-name">비즈니스 #${ap.businessProfile_id} ${statusBadge(ap.appointmentStatus)}</div>
                    <div class="ap-time">요청: ${fmtDateTime(ap.requestTime)}</div>
                    ${suggestLine}
                </div>
            </div>`;
        }).join('');
    }

    function emptyHtml(msg) {
        return `<div class="empty-state"><div class="empty-icon">📭</div><p>${msg}</p></div>`;
    }

    // ── 상세 모달 ──
    let currentAid = null;
    async function openDetail(aid) {
        currentAid = aid;
        const ap = await fetch(`/appointment/${aid}`).then(r => r.json());

        const d = new Date(ap.requestTime);
        document.getElementById('modalDate').textContent = `${d.getMonth()+1}월 ${d.getDate()}일`;
        document.getElementById('modalSub').textContent =
            `${d.getFullYear()}년 · ${WEEKDAYS[d.getDay()]}요일 · ${fmtTime(ap.requestTime)}`;

        const suggestBlock = ap.appointmentStatus === 'SUGGESTED' && ap.suggestTime
            ? `<div class="suggest-banner">💜 새로운 시간을 제안받았어요<div class="suggest-time">${fmtDateTime(ap.suggestTime)}</div></div>` : '';

        document.getElementById('modalBody').innerHTML = `
            <div class="modal-row">
                <div class="modal-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                <div><div class="modal-row-label">예약 번호</div><div class="modal-row-value">#${ap.aid}</div></div>
            </div>
            <div class="modal-row">
                <div class="modal-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                <div><div class="modal-row-label">예약 일시</div><div class="modal-row-value">${fmtDateTime(ap.requestTime)}</div></div>
            </div>
            <div class="modal-row">
                <div class="modal-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                <div><div class="modal-row-label">${isBusiness ? '고객' : '비즈니스'}</div><div class="modal-row-value">${isBusiness ? `${ap.requesterSnapiaId}(${ap.requesterName})` : `#${ap.businessProfile_id}`}</div></div>
            </div>
            <div class="modal-row">
                <div class="modal-row-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                <div><div class="modal-row-label">상태</div><div class="modal-row-value">${statusBadge(ap.appointmentStatus)}</div></div>
            </div>
            ${ap.rejectReason ? `<div class="modal-row"><div class="modal-row-icon">✕</div><div><div class="modal-row-label">거절 사유</div><div class="modal-row-value">${ap.rejectReason}</div></div></div>` : ''}
            ${suggestBlock}
        `;

        const footer = document.getElementById('modalFooter');
        if (isBusiness && ap.appointmentStatus === 'WAIT') {
            footer.innerHTML = `
                <button class="modal-btn danger" onclick="openReject(${ap.aid}); closeModal()">거절</button>
                <button class="modal-btn purple" onclick="openSuggest(${ap.aid}); closeModal()">역제안</button>
                <button class="modal-btn primary" onclick="acceptAp(${ap.aid}); closeModal()">수락</button>`;
        } else if (!isBusiness && ap.appointmentStatus === 'WAIT') {
            footer.innerHTML = `<button class="modal-btn danger" onclick="cancelAp(${ap.aid})">예약 취소</button>`;
        } else if (!isBusiness && ap.appointmentStatus === 'SUGGESTED' && ap.suid) {
            footer.innerHTML = `
                <button class="modal-btn danger" onclick="rejectSuggest(${ap.suid})">거절</button>
                <button class="modal-btn primary" onclick="acceptSuggest(${ap.suid})">수락</button>`;
        } else {
            footer.innerHTML = `<button class="modal-btn" onclick="closeModal()">닫기</button>`;
        }

        document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() { document.getElementById('detailModal').classList.remove('active'); }
    function closeModalOutside(e) { if (e.target === document.getElementById('detailModal')) closeModal(); }

    // ── 수락/거절/취소/역제안 ──
    async function acceptAp(aid) {
        await fetch('/appointment/accept', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({aid}) });
        loadAll();
    }

    let rejectTargetAid = null;
    function openReject(aid) { rejectTargetAid = aid; document.getElementById('rejectReason').value = ''; document.getElementById('rejectModal').classList.add('active'); }
    function closeRejectModal() { document.getElementById('rejectModal').classList.remove('active'); rejectTargetAid = null; }
    async function confirmReject() {
        const reason = document.getElementById('rejectReason').value.trim();
        await fetch('/appointment/reject', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({aid: rejectTargetAid, rejectReason: reason}) });
        closeRejectModal(); loadAll();
    }

    let suggestTargetAid = null;
    function openSuggest(aid) { suggestTargetAid = aid; document.getElementById('suggestTime').value = ''; document.getElementById('suggestModal').classList.add('active'); }
    function closeSuggestModal() { document.getElementById('suggestModal').classList.remove('active'); suggestTargetAid = null; }
    async function confirmSuggest() {
        const raw = document.getElementById('suggestTime').value;
        if (!raw) { alert('시간을 선택해주세요.'); return; }
        await fetch('/suggest/create', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({appointmentId: suggestTargetAid, suggestTime: raw + ':00'}) });
        closeSuggestModal(); loadAll();
    }

    async function cancelAp(aid) {
        if (!confirm('예약을 취소하시겠습니까?')) return;
        await fetch('/appointment/cancel', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({aid, cancelUid: currentUid}) });
        closeModal(); loadAll();
    }

    async function acceptSuggest(suid) {
        await fetch('/suggest/accept', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({suid: suid}) });
        closeModal(); loadAll();
    }

    async function rejectSuggest(suid) {
        await fetch('/suggest/reject', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({suid: suid, rejectReason: ''}) });
        closeModal(); loadAll();
    }

    // ── 캘린더 ──
    let currentYear, currentMonth;

    function getConfirmedForDate(y, m, d) {
        return confirmedList.filter(ap => {
            if (!ap.requestTime) return false;
            const dt = new Date(ap.requestTime);
            return dt.getFullYear() === y && dt.getMonth() === m && dt.getDate() === d;
        });
    }

    function renderCalendar() {
        document.getElementById('monthLabel').textContent = `${currentYear}년 ${MONTHS[currentMonth]}`;
        const container = document.getElementById('calDays');
        container.innerHTML = '';

        const today = new Date();
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();

        for (let i = firstDay - 1; i >= 0; i--) {
            container.appendChild(createDayCell(currentYear, currentMonth - 1, daysInPrev - i, true));
        }
        for (let d = 1; d <= daysInMonth; d++) {
            const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;
            container.appendChild(createDayCell(currentYear, currentMonth, d, false, isToday));
        }
        const total = firstDay + daysInMonth;
        const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
        for (let d = 1; d <= remaining; d++) {
            container.appendChild(createDayCell(currentYear, currentMonth + 1, d, true));
        }
    }

    function createDayCell(year, month, day, isOther, isToday = false) {
        const dow = new Date(year, month, day).getDay();
        const cell = document.createElement('div');
        let cls = 'cal-day';
        if (isOther) cls += ' other-month';
        if (isToday) cls += ' today';
        if (dow === 0) cls += ' sunday';
        if (dow === 6) cls += ' saturday';
        cell.className = cls;

        const numEl = document.createElement('div');
        numEl.className = 'day-num';
        numEl.textContent = day;
        cell.appendChild(numEl);

        if (!isOther) {
            getConfirmedForDate(year, month, day).forEach(ap => {
                const ev = document.createElement('div');
                ev.className = 'ap-event';
                const label = isBusiness ? `${ap.requesterSnapiaId}(${ap.requesterName})` : `비즈니스 #${ap.businessProfile_id}`;
                ev.textContent = `${fmtTime(ap.requestTime)} ${label}`;

                const tip = document.createElement('div');
                tip.className = 'tooltip';
                tip.innerHTML = `<div style="font-weight:600">${fmtDateTime(ap.requestTime)}</div><div>${label}</div><div style="color:rgba(255,255,255,0.6)">예약 #${ap.aid}</div>`;
                ev.appendChild(tip);
                ev.addEventListener('click', e => { e.stopPropagation(); openDetail(ap.aid); });
                cell.appendChild(ev);
            });
        }
        return cell;
    }

    function prevMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); }
    function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); }
    function goToday() { const t = new Date(); currentYear = t.getFullYear(); currentMonth = t.getMonth(); renderCalendar(); }

    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    loadAll();
</script>

<th:block th:replace="~{fragments/header :: headerScript}"></th:block>
</body>
