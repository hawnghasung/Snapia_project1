<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapia Story Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 뷰어 컨테이너 */
        .story-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            position: relative;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 상단 프로그레스 바 */
        .progress-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .progress-bar {
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            flex-grow: 1;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* 사용자 정보 */
        .user-info {
            position: absolute;
            top: 25px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .user-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid white;
            object-fit: cover;
        }
        .user-info span {
            font-size: 14px;
            font-weight: 600;
        }
        .story-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 8px;
        }

        /* 메인 콘텐츠(이미지) */
        .story-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .story-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 좌우 클릭 영역 */
        .nav-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 30%;
            z-index: 5;
            cursor: pointer;
        }
        .nav-left { left: 0; }
        .nav-right { right: 0; }

        /* 닫기 버튼 */
        .close-btn {
            position: absolute;
            top: 25px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* 삭제 버튼 (본인 스토리일 때만) */
        .delete-btn {
            position: absolute;
            top: 65px;
            right: 15px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            display: none;
        }
        .delete-btn:hover {
            background-color: rgba(255, 0, 0, 0.9);
        }

        /* 로딩 표시 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

<div class="story-container">
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="user-info">
        <img src="/images/default-profile.png" alt="profile" id="userImg">
        <div>
            <span id="userId">Loading...</span>
            <span class="story-time" id="storyTime"></span>
        </div>
    </div>

    <div class="close-btn" onclick="closeViewer()"><i class="fas fa-times"></i></div>
    <button class="delete-btn" id="deleteBtn" onclick="deleteCurrentStory()">삭제</button>

    <div class="story-content">
        <div class="loading" id="loadingText">스토리를 불러오는 중...</div>
        <img src="" alt="story image" id="storyImg" style="display: none;">
    </div>

    <div class="nav-zone nav-left" onclick="prevStory()"></div>
    <div class="nav-zone nav-right" onclick="nextStory()"></div>
</div>

<script th:inline="javascript">
    const currentSid = [[${storyId}]];
    const STORY_DURATION = 5000;

    // 유저별 그룹: [ { userId, snapiaId, profileImageUrl, stories: [...] }, ... ]
    let userGroups = [];
    let groupIndex = 0;   // 현재 유저 그룹
    let storyIndex = 0;   // 그룹 내 스토리 인덱스

    let progressInterval;
    let progress = 0;
    let isPaused = false;

    // ── 초기 로드 ──────────────────────────────────────
    async function loadStories() {
        try {
            const res = await fetch('/story/following');
            if (!res.ok) throw new Error();
            const flat = await res.json();

            // 유저별로 그룹핑 (순서 유지)
            const map = new Map();
            flat.forEach(s => {
                if (!map.has(s.userId)) map.set(s.userId, []);
                map.get(s.userId).push(s);
            });

            userGroups = [...map.entries()].map(([uid, stories]) => ({
                userId: uid,
                snapiaId: stories[0].snapiaId,
                profileImageUrl: stories[0].profileImageUrl,
                stories // 이미 최신순 정렬됨 (서버에서 OrderByCreatedAtDesc)
            }));

            // 클릭한 sid가 속한 그룹/인덱스 찾기
            outer: for (let g = 0; g < userGroups.length; g++) {
                for (let s = 0; s < userGroups[g].stories.length; s++) {
                    if (userGroups[g].stories[s].sid == currentSid) {
                        groupIndex = g;
                        storyIndex = s;
                        break outer;
                    }
                }
            }

            renderProgressBars();
            showStory();
        } catch (e) {
            document.getElementById('loadingText').textContent = '스토리를 불러올 수 없습니다.';
            setTimeout(closeViewer, 2000);
        }
    }

    // ── 프로그레스 바 렌더 (그룹 내 스토리 수만큼) ────
    function renderProgressBars() {
        const container = document.getElementById('progressContainer');
        const count = userGroups[groupIndex].stories.length;
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const bar = document.createElement('div');
            bar.className = 'progress-bar';
            bar.innerHTML = `<div class="progress-fill" id="fill-${i}"></div>`;
            container.appendChild(bar);
        }
        // 이미 본 스토리는 꽉 채우기
        for (let i = 0; i < storyIndex; i++) {
            const f = document.getElementById(`fill-${i}`);
            if (f) f.style.width = '100%';
        }
    }

    // ── 현재 스토리 표시 ───────────────────────────────
    function showStory() {
        clearInterval(progressInterval);

        const group = userGroups[groupIndex];
        const story = group.stories[storyIndex];

        const storyImg = document.getElementById('storyImg');
        const loadingText = document.getElementById('loadingText');

        storyImg.style.display = 'none';
        loadingText.style.display = 'block';

        storyImg.onload = () => {
            loadingText.style.display = 'none';
            storyImg.style.display = 'block';
            startProgressBar();
        };
        storyImg.onerror = () => { setTimeout(nextStory, 800); };
        storyImg.src = story.storyImgUrl ? `/upload/${story.storyImgUrl}` : '';

        // 유저 정보
        document.getElementById('userImg').src = group.profileImageUrl
            ? `/upload/${group.profileImageUrl}`
            : `https://i.pravatar.cc/150?u=${group.userId}`;
        document.getElementById('userId').textContent = group.snapiaId || 'Unknown';
        document.getElementById('storyTime').textContent = getTimeAgo(story.createdAt);

        // 삭제 버튼: 본인 그룹이면 표시
        // 첫 번째 그룹이 본인(getFollowingStories에서 본인 포함)일 수 있으므로
        // sid 기준으로 서버에서 isOwner 판단하도록 fetch
        checkOwner(story.sid);
    }

    async function checkOwner(sid) {
        try {
            const res = await fetch(`/story/detail/${sid}`);
            const data = await res.json();
            // StoryDTO에 isOwner 필드가 있으면 활용, 없으면 숨김 유지
            document.getElementById('deleteBtn').style.display =
                data.isOwner === true ? 'block' : 'none';
        } catch { document.getElementById('deleteBtn').style.display = 'none'; }
    }

    // ── 프로그레스 바 애니메이션 ────────────────────────
    function startProgressBar() {
        progress = 0;
        const fill = document.getElementById(`fill-${storyIndex}`);

        progressInterval = setInterval(() => {
            if (isPaused) return;
            progress += 2;
            if (fill) fill.style.width = progress + '%';
            if (progress >= 100) nextStory();
        }, 100);
    }

    // ── 다음: 같은 유저 스토리 → 다음 유저 그룹 ────────
    function nextStory() {
        clearInterval(progressInterval);
        const group = userGroups[groupIndex];

        if (storyIndex < group.stories.length - 1) {
            // 같은 유저의 다음 스토리
            storyIndex++;
            renderProgressBars();
            showStory();
        } else if (groupIndex < userGroups.length - 1) {
            // 다음 유저 그룹으로
            groupIndex++;
            storyIndex = 0;
            renderProgressBars();
            showStory();
        } else {
            closeViewer();
        }
    }

    // ── 이전: 같은 유저 스토리 → 이전 유저 그룹 ────────
    function prevStory() {
        clearInterval(progressInterval);

        if (storyIndex > 0) {
            storyIndex--;
            renderProgressBars();
            showStory();
        } else if (groupIndex > 0) {
            groupIndex--;
            storyIndex = userGroups[groupIndex].stories.length - 1;
            renderProgressBars();
            showStory();
        }
        // 첫 번째면 아무것도 안 함
    }

    // ── 닫기 ────────────────────────────────────────────
    function closeViewer() {
        clearInterval(progressInterval);
        window.history.back();
    }

    // ── 삭제 ────────────────────────────────────────────
    async function deleteCurrentStory() {
        if (!confirm('이 스토리를 삭제하시겠습니까?')) return;
        const story = userGroups[groupIndex].stories[storyIndex];
        try {
            const res = await fetch(`/story/${story.sid}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.success) {
                const group = userGroups[groupIndex];
                group.stories.splice(storyIndex, 1);

                if (group.stories.length === 0) {
                    userGroups.splice(groupIndex, 1);
                    if (userGroups.length === 0) { closeViewer(); return; }
                    if (groupIndex >= userGroups.length) groupIndex--;
                    storyIndex = 0;
                } else {
                    if (storyIndex >= group.stories.length) storyIndex = group.stories.length - 1;
                }
                renderProgressBars();
                showStory();
            } else {
                alert(result.message || '삭제 실패');
            }
        } catch { alert('오류가 발생했습니다.'); }
    }

    // ── 유틸 ────────────────────────────────────────────
    function getTimeAgo(createdAt) {
        if (!createdAt) return '';
        const diff = Date.now() - new Date(createdAt).getTime();
        const min = Math.floor(diff / 60000);
        if (min < 1) return '방금 전';
        if (min < 60) return `${min}분 전`;
        const hr = Math.floor(min / 60);
        if (hr < 24) return `${hr}시간 전`;
        return `${Math.floor(hr / 24)}일 전`;
    }

    // ── 일시정지 이벤트 ─────────────────────────────────
    const container = document.querySelector('.story-container');
    container.addEventListener('mousedown', () => isPaused = true);
    container.addEventListener('mouseup',   () => isPaused = false);
    container.addEventListener('mouseleave',() => isPaused = false);
    container.addEventListener('touchstart',() => isPaused = true);
    container.addEventListener('touchend',  () => isPaused = false);

    loadStories();
</script>
</body>
</html>
