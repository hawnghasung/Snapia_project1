<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapia Story Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 뷰어 컨테이너 */
        .story-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            position: relative;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 상단 프로그레스 바 */
        .progress-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .progress-bar {
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            flex-grow: 1;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* 사용자 정보 */
        .user-info {
            position: absolute;
            top: 25px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .user-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid white;
            object-fit: cover;
        }
        .user-info span {
            font-size: 14px;
            font-weight: 600;
        }
        .story-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 8px;
        }

        /* 메인 콘텐츠(이미지) */
        .story-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .story-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 좌우 클릭 영역 */
        .nav-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 30%;
            z-index: 5;
            cursor: pointer;
        }
        .nav-left { left: 0; }
        .nav-right { right: 0; }

        /* 닫기 버튼 */
        .close-btn {
            position: absolute;
            top: 25px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* 삭제 버튼 (본인 스토리일 때만) */
        .delete-btn {
            position: absolute;
            top: 65px;
            right: 15px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            display: none;
        }
        .delete-btn:hover {
            background-color: rgba(255, 0, 0, 0.9);
        }

        /* 로딩 표시 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

<div class="story-container">
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="user-info">
        <img src="/images/default-profile.png" alt="profile" id="userImg">
        <div>
            <span id="userId">Loading...</span>
            <span class="story-time" id="storyTime"></span>
        </div>
    </div>

    <div class="close-btn" onclick="closeViewer()"><i class="fas fa-times"></i></div>
    <button class="delete-btn" id="deleteBtn" onclick="deleteCurrentStory()">삭제</button>

    <div class="story-content">
        <div class="loading" id="loadingText">스토리를 불러오는 중...</div>
        <img src="" alt="story image" id="storyImg" style="display: none;">
    </div>

    <div class="nav-zone nav-left" onclick="prevStory()"></div>
    <div class="nav-zone nav-right" onclick="nextStory()"></div>
</div>

<script th:inline="javascript">
    // 타임리프로 전달받은 storyId
    const currentSid = [[${storyId}]];
    let stories = [];
    let currentIndex = 0;
    let progressInterval;
    let progress = 0;
    const STORY_DURATION = 5000; // 5초
    let isPaused = false;

    // 현재 로그인한 사용자 정보 (본인 스토리 삭제용)
    let currentUserId = null;

    // 1. 팔로잉 스토리 목록 가져오기
    async function loadStories() {
        try {
            const response = await fetch('/story/following');
            if (!response.ok) throw new Error('스토리 로드 실패');

            stories = await response.json();

            // 현재 클릭한 sid의 인덱스 찾기
            currentIndex = stories.findIndex(s => s.sid == currentSid);
            if(currentIndex === -1) currentIndex = 0;

            // 현재 사용자 정보 가져오기 (본인 확인용)
            await getCurrentUser();

            showStory();
        } catch (error) {
            console.error("스토리 로드 실패:", error);
            document.getElementById('loadingText').textContent = '스토리를 불러올 수 없습니다.';
            setTimeout(() => closeViewer(), 2000);
        }
    }

    // 2. 현재 로그인 사용자 정보 가져오기
    async function getCurrentUser() {
        try {
            // 프로필 페이지에서 사용자 정보를 가져오거나, 별도 API 필요
            // 여기서는 간단하게 첫 번째 스토리의 userId와 비교
            // 실제로는 세션에서 currentUserId를 가져와야 함
        } catch (error) {
            console.error('사용자 정보 가져오기 실패:', error);
        }
    }

    // 3. 스토리 화면에 표시
    function showStory() {
        if (currentIndex >= stories.length) {
            alert("모든 스토리를 다 보셨습니다.");
            closeViewer();
            return;
        }

        const story = stories[currentIndex];

        // 이미지 로드
        const storyImg = document.getElementById('storyImg');
        const loadingText = document.getElementById('loadingText');

        storyImg.style.display = 'none';
        loadingText.style.display = 'block';

        storyImg.onload = function() {
            loadingText.style.display = 'none';
            storyImg.style.display = 'block';
            startProgressBar();
        };

        storyImg.onerror = function() {
            loadingText.textContent = '이미지를 불러올 수 없습니다.';
            setTimeout(() => nextStory(), 1000);
        };

        storyImg.src = story.storyImgUrl ? `/upload/${story.storyImgUrl}` : '';

        // 사용자 정보 표시
        const userImg = document.getElementById('userImg');
        userImg.src = story.profileImageUrl
            ? `/upload/${story.profileImageUrl}`
            : `https://i.pravatar.cc/150?u=${story.userId}`;

        document.getElementById('userId').textContent = story.snapiaId || 'Unknown';

        // 시간 표시 (몇 시간 전)
        const timeAgo = getTimeAgo(story.createdAt);
        document.getElementById('storyTime').textContent = timeAgo;

        // 본인 스토리면 삭제 버튼 표시
        // (실제로는 서버에서 받은 currentUserId와 비교해야 함)
        const deleteBtn = document.getElementById('deleteBtn');
        // 임시로 주석 처리 - 실제로는 세션 정보 확인 필요
        // deleteBtn.style.display = (story.userId === currentUserId) ? 'block' : 'none';
    }

    // 4. 프로그레스 바 애니메이션
    function startProgressBar() {
        clearInterval(progressInterval);
        progress = 0;
        const fill = document.getElementById('progressFill');

        progressInterval = setInterval(() => {
            if (!isPaused) {
                progress += 2; // 0.1초마다 2%씩 증가 (총 5초)
                fill.style.width = progress + '%';

                if (progress >= 100) {
                    nextStory();
                }
            }
        }, 100);
    }

    // 5. 다음 스토리
    function nextStory() {
        clearInterval(progressInterval);
        if (currentIndex < stories.length - 1) {
            currentIndex++;
            showStory();
        } else {
            closeViewer();
        }
    }

    // 6. 이전 스토리
    function prevStory() {
        clearInterval(progressInterval);
        if (currentIndex > 0) {
            currentIndex--;
            showStory();
        }
    }

    // 7. 뷰어 닫기
    function closeViewer() {
        clearInterval(progressInterval);
        window.history.back();
    }

    // 8. 스토리 삭제
    async function deleteCurrentStory() {
        if (!confirm('이 스토리를 삭제하시겠습니까?')) return;

        const story = stories[currentIndex];

        try {
            const response = await fetch(`/story/${story.sid}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (result.success) {
                alert('스토리가 삭제되었습니다.');
                // 스토리 목록에서 제거
                stories.splice(currentIndex, 1);

                // 다음 스토리 표시 또는 닫기
                if (stories.length > 0 && currentIndex < stories.length) {
                    showStory();
                } else if (stories.length > 0 && currentIndex > 0) {
                    currentIndex--;
                    showStory();
                } else {
                    closeViewer();
                }
            } else {
                alert(result.message || '스토리 삭제에 실패했습니다.');
            }
        } catch (error) {
            console.error('스토리 삭제 오류:', error);
            alert('스토리 삭제 중 오류가 발생했습니다.');
        }
    }

    // 9. 시간 계산 (몇 시간 전)
    function getTimeAgo(createdAt) {
        if (!createdAt) return '';

        const now = new Date();
        const created = new Date(createdAt);
        const diffMs = now - created;
        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
        const diffMinutes = Math.floor(diffMs / (1000 * 60));

        if (diffMinutes < 1) return '방금 전';
        if (diffMinutes < 60) return `${diffMinutes}분 전`;
        if (diffHours < 24) return `${diffHours}시간 전`;
        return `${Math.floor(diffHours / 24)}일 전`;
    }

    // 10. 마우스/터치 이벤트로 일시정지
    const container = document.querySelector('.story-container');

    container.addEventListener('mousedown', () => {
        isPaused = true;
    });

    container.addEventListener('mouseup', () => {
        isPaused = false;
    });

    container.addEventListener('mouseleave', () => {
        isPaused = false;
    });

    container.addEventListener('touchstart', () => {
        isPaused = true;
    });

    container.addEventListener('touchend', () => {
        isPaused = false;
    });

    // 초기 로드
    loadStories();
</script>
</body>
</html>
