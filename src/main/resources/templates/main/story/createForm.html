<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스토리 만들기 - Snapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/header :: headerStyles}"></th:block>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
        }

        .page-wrap {
            max-width: 480px;
            margin: 80px auto 40px;
            padding: 0 16px;
        }

        .card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            overflow: hidden;
        }

        .card-header {
            padding: 14px 16px;
            border-bottom: 1px solid #efefef;
            font-size: 15px;
            font-weight: 700;
            color: #262626;
            text-align: center;
        }

        .card-body { padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }

        /* 업로드 영역 */
        .upload-zone {
            border: 2px dashed #dbdbdb;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            position: relative;
        }
        .upload-zone:hover { border-color: #a8a8a8; background: #fafafa; }
        .upload-zone.has-file { border-color: #0095f6; border-style: solid; padding: 0; overflow: hidden; }

        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .upload-text { font-size: 14px; font-weight: 600; color: #262626; margin-bottom: 4px; }
        .upload-hint { font-size: 12px; color: #8e8e8e; }

        #previewImg { width: 100%; max-height: 320px; object-fit: contain; display: block; background: #000; }
        #previewVideo { width: 100%; max-height: 320px; display: block; background: #000; }

        .file-badge {
            display: none;
            margin-top: 8px;
            font-size: 12px;
            color: #8e8e8e;
            text-align: center;
        }
        .file-badge.show { display: block; }
        .file-badge.warn { color: #ed4956; }

        /* 폼 라벨 */
        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #262626;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
            display: block;
        }

        /* 버튼 */
        .card-footer {
            padding: 14px 20px;
            border-top: 1px solid #efefef;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .btn-cancel {
            padding: 8px 16px;
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Instrument Sans', sans-serif;
            color: #262626;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.15s;
        }
        .btn-cancel:hover { background: #fafafa; }
        .btn-submit {
            padding: 8px 20px;
            background: #0095f6;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Instrument Sans', sans-serif;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-submit:hover { opacity: 0.85; }
        .btn-submit:disabled { background: #b2dffc; cursor: not-allowed; }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="page-wrap">
    <div class="card">
        <div class="card-header">새 스토리</div>

        <form th:action="@{/story}" method="post" enctype="multipart/form-data" id="storyForm">
            <div class="card-body">

                <!-- 업로드 영역 -->
                <div>
                    <div class="upload-zone" id="uploadZone"
                         onclick="document.getElementById('fileInput').click()"
                         ondragover="onDragOver(event)"
                         ondragleave="onDragLeave(event)"
                         ondrop="onDrop(event)">
                        <div id="uploadPrompt">
                            <div class="upload-icon">📷</div>
                            <div class="upload-text">사진 또는 동영상 선택</div>
                            <div class="upload-hint">또는 여기로 드래그하세요</div>
                        </div>
                        <img id="previewImg" style="display:none;" alt="미리보기">
                        <video id="previewVideo" style="display:none;" controls playsinline></video>
                    </div>
                    <input type="file" id="fileInput" name="file"
                           accept="image/*,video/*" style="display:none"
                           onchange="handleFile(this.files[0])">
                    <div class="file-badge" id="fileBadge"></div>
                </div>

            </div>

            <div class="card-footer">
                <a href="/profile" class="btn-cancel">취소</a>
                <button type="submit" class="btn-submit" id="submitBtn" disabled>스토리 올리기</button>
            </div>
        </form>
    </div>
</div>

<script>
    const zone      = document.getElementById('uploadZone');
    const prompt    = document.getElementById('uploadPrompt');
    const prevImg   = document.getElementById('previewImg');
    const prevVideo = document.getElementById('previewVideo');
    const badge     = document.getElementById('fileBadge');
    const submitBtn = document.getElementById('submitBtn');

    function handleFile(file) {
        if (!file) return;
        const isVideo = file.type.startsWith('video/');
        const isImage = file.type.startsWith('image/');
        if (!isVideo && !isImage) return;

        const sizeMB = (file.size / 1024 / 1024).toFixed(1);
        prompt.style.display = 'none';
        zone.classList.add('has-file');
        prevImg.style.display = 'none';
        prevVideo.style.display = 'none';

        if (isVideo) {
            prevVideo.src = URL.createObjectURL(file);
            prevVideo.style.display = 'block';
            prevVideo.onloadedmetadata = () => {
                const dur = Math.floor(prevVideo.duration);
                if (dur > 60) {
                    badge.textContent = `⚠️ ${dur}초 — 60초 이하만 업로드 가능합니다`;
                    badge.className = 'file-badge show warn';
                    submitBtn.disabled = true;
                } else {
                    badge.textContent = `✅ ${dur}초 · ${sizeMB}MB`;
                    badge.className = 'file-badge show';
                    submitBtn.disabled = false;
                }
            };
        } else {
            const reader = new FileReader();
            reader.onload = e => { prevImg.src = e.target.result; prevImg.style.display = 'block'; };
            reader.readAsDataURL(file);
            badge.textContent = `📁 ${sizeMB}MB`;
            badge.className = 'file-badge show';
            submitBtn.disabled = false;
        }
    }

    function onDragOver(e) { e.preventDefault(); zone.style.borderColor = '#0095f6'; }
    function onDragLeave(e) { zone.style.borderColor = ''; }
    function onDrop(e) {
        e.preventDefault();
        zone.style.borderColor = '';
        const file = e.dataTransfer.files?.[0];
        if (file) {
            // dataTransfer는 input.files에 직접 못 넣으니 처리만
            handleFile(file);
            // form 제출 시 file을 쓰려면 별도 FormData 처리 필요
            // 여기선 클릭 업로드 유도
        }
    }
</script>

<th:block th:replace="~{fragments/header :: headerScript}"></th:block>
</body>
</html>
