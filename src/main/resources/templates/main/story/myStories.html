<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스토리 - Snapia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000;
            overflow: hidden;
        }

        .story-viewer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 블러 배경 */
        .bg-blur {
            position: fixed; inset: 0;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.25) saturate(1.4);
            transform: scale(1.1); z-index: 0;
            transition: background-image 0.3s ease;
        }

        .story-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #111;
            z-index: 1;
            overflow: hidden;
        }

        /* 진행바 */
        .progress-bars {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; gap: 4px; z-index: 10;
        }
        .progress-bar {
            flex: 1; height: 2.5px;
            background: rgba(255,255,255,0.3); border-radius: 99px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: #fff; width: 0%;
            transition: width 0.1s linear; border-radius: 99px;
        }
        .progress-fill.done { width: 100%; }

        /* 헤더 */
        .story-header {
            position: absolute; top: 26px; left: 12px; right: 12px;
            display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            object-fit: cover; border: 2px solid rgba(255,255,255,0.8);
        }
        .user-name { color: #fff; font-size: 14px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
        .story-time { color: rgba(255,255,255,0.6); font-size: 12px; margin-left: 4px; }

        .close-btn {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(0,0,0,0.35); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; font-size: 16px;
            transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(0,0,0,0.6); }

        /* 스토리 미디어 */
        .story-media {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        /* 하단 그라디언트 */
        .bottom-grad {
            position: absolute; bottom: 0; left: 0; right: 0; height: 180px;
            background: linear-gradient(transparent, rgba(0,0,0,0.65));
            pointer-events: none; z-index: 6;
        }

        /* 네비게이션 터치존 */
        .nav-zone {
            position: absolute; top: 0; height: 100%; width: 35%; z-index: 5; cursor: pointer;
        }
        .nav-left { left: 0; }
        .nav-right { right: 0; }

        /* 답장 입력 */
        .reply-area {
            position: absolute; bottom: 20px; left: 12px; right: 12px;
            display: flex; align-items: center; gap: 10px; z-index: 10;
        }
        .reply-input {
            flex: 1; padding: 10px 16px;
            border: 1.5px solid rgba(255,255,255,0.4); border-radius: 24px;
            background: transparent; color: #fff; font-size: 14px;
            font-family: 'Instrument Sans', sans-serif; outline: none;
            transition: border-color 0.2s;
        }
        .reply-input::placeholder { color: rgba(255,255,255,0.55); }
        .reply-input:focus { border-color: rgba(255,255,255,0.8); }

        /* 빈 상태 */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; gap: 16px; color: rgba(255,255,255,0.7);
        }
        .empty-state .icon { font-size: 48px; }
        .empty-state p { font-size: 14px; }
        .empty-back {
            margin-top: 8px; padding: 10px 24px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: 'Instrument Sans', sans-serif;
            transition: background 0.2s;
        }
        .empty-back:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>

<div class="story-viewer">
    <div class="bg-blur" id="bgBlur"></div>

    <div class="story-container" id="storyContainer">

        <!-- 진행바 -->
        <div class="progress-bars" id="progressBars"></div>

        <!-- 헤더 -->
        <div class="story-header">
            <div class="user-info">
                <img id="userAvatar" src="/images/default_profile.png" class="user-avatar" alt="프로필">
                <span id="userName" class="user-name">username</span>
                <span id="storyTime" class="story-time"></span>
            </div>
            <div class="close-btn" onclick="closeStory()">✕</div>
        </div>

        <!-- 미디어 -->
        <img id="storyImage" class="story-media" src="" alt="스토리" style="display:none;">
        <video id="storyVideo" class="story-media" playsinline style="display:none;"></video>

        <!-- 네비게이션 -->
        <div class="nav-zone nav-left" onclick="prevStory()"></div>
        <div class="nav-zone nav-right" onclick="nextStory()"></div>

        <!-- 하단 -->
        <div class="bottom-grad"></div>
        <div class="reply-area">
            <input type="text" class="reply-input" id="replyInput"
                   placeholder="메시지 보내기..."
                   onkeydown="if(event.key==='Enter') sendReply()">
        </div>

        <!-- 빈 상태 -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="icon">📷</div>
            <p>스토리를 찾을 수 없습니다</p>
            <button class="empty-back" onclick="closeStory()">돌아가기</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const storyId = [[${storyId}]];
    const STORY_DURATION = 5000;

    let stories = [];
    let storyIndex = 0;
    let progressInterval = null;
    let progress = 0;
    let isPaused = false;

    window.addEventListener('DOMContentLoaded', loadStories);

    async function loadStories() {
        try {
            // 단일 스토리 or 유저 스토리 목록 로드
            const res = await fetch(`/story/viewer/${storyId}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            stories = Array.isArray(data) ? data : [data];
            storyIndex = 0;
            renderProgressBars();
            showStory();
        } catch {
            document.getElementById('emptyState').style.display = 'flex';
        }
    }

    function renderProgressBars() {
        const bars = document.getElementById('progressBars');
        bars.innerHTML = stories.map((_, i) => `
            <div class="progress-bar">
                <div class="progress-fill ${i < storyIndex ? 'done' : ''}" id="fill-${i}"></div>
            </div>
        `).join('');
    }

    function showStory() {
        clearInterval(progressInterval);
        progress = 0;

        const story = stories[storyIndex];
        if (!story) { closeStory(); return; }

        const img   = document.getElementById('storyImage');
        const video = document.getElementById('storyVideo');
        const bg    = document.getElementById('bgBlur');

        // 배경 블러
        const mediaSrc = story.storyImgUrl ? `/upload/${story.storyImgUrl}` : '';
        bg.style.backgroundImage = mediaSrc ? `url('${mediaSrc}')` : 'none';

        // 프로필 정보
        document.getElementById('userAvatar').src =
            story.profileImageUrl ? `/upload/${story.profileImageUrl}` : '/images/default_profile.png';
        document.getElementById('userName').textContent = story.snapiaId || '';
        document.getElementById('storyTime').textContent = getTimeAgo(story.createdAt);

        if (story.mediaType === 'VIDEO' && story.storyImgUrl) {
            img.style.display = 'none';
            video.src = `/upload/${story.storyImgUrl}`;
            video.style.display = 'block';
            video.play().catch(() => {});
            video.onloadedmetadata = () => startProgressBar(video.duration * 1000);
        } else {
            video.pause(); video.style.display = 'none';
            img.src = mediaSrc || '/images/default_profile.png';
            img.style.display = 'block';
            startProgressBar(STORY_DURATION);
        }
    }

    function startProgressBar(duration) {
        const fill = document.getElementById(`fill-${storyIndex}`);
        progressInterval = setInterval(() => {
            if (isPaused) return;
            progress += 100 / (duration / 100);
            if (fill) fill.style.width = Math.min(progress, 100) + '%';
            if (progress >= 100) nextStory();
        }, 100);
    }

    function prevStory() {
        clearInterval(progressInterval);
        document.getElementById('storyVideo').pause();
        if (storyIndex > 0) { storyIndex--; renderProgressBars(); showStory(); }
    }

    function nextStory() {
        clearInterval(progressInterval);
        document.getElementById('storyVideo').pause();
        if (storyIndex < stories.length - 1) { storyIndex++; renderProgressBars(); showStory(); }
        else closeStory();
    }

    function closeStory() {
        clearInterval(progressInterval);
        document.getElementById('storyVideo').pause();
        history.back();
    }

    function sendReply() {
        const input = document.getElementById('replyInput');
        const content = input.value.trim();
        if (!content || !stories[storyIndex]) return;
        const story = stories[storyIndex];
        // DM 방 생성 후 메시지 전송
        fetch('/room/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ receiverId: story.userId })
        }).then(r => r.json()).then(room => {
            return fetch('/dm/send/story-reply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roid: room.roid, content, replyStorySid: story.sid })
            });
        }).then(() => { input.value = ''; }).catch(() => {});
    }

    function getTimeAgo(createdAt) {
        if (!createdAt) return '';
        const diff = Date.now() - new Date(createdAt).getTime();
        const min = Math.floor(diff / 60000);
        if (min < 1) return '방금 전';
        if (min < 60) return `${min}분 전`;
        const hr = Math.floor(min / 60);
        if (hr < 24) return `${hr}시간 전`;
        return `${Math.floor(hr / 24)}일 전`;
    }

    // 꾹 누르면 일시정지
    const container = document.getElementById('storyContainer');
    container.addEventListener('mousedown', e => {
        if (!e.target.closest('.reply-area') && !e.target.closest('.close-btn')) isPaused = true;
    });
    container.addEventListener('mouseup', () => isPaused = false);
    container.addEventListener('mouseleave', () => isPaused = false);
    container.addEventListener('touchstart', e => {
        if (!e.target.closest('.reply-area') && !e.target.closest('.close-btn')) isPaused = true;
    }, { passive: true });
    container.addEventListener('touchend', () => isPaused = false);
</script>
</body>
</html>
