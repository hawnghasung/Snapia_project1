<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 편집 - Snapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">

<!-- 네비게이션 바 -->
<nav class="bg-white border-b border-gray-300 fixed top-0 left-0 right-0 z-50">
    <div class="max-w-5xl mx-auto px-5 py-2 flex justify-between items-center">
        <a href="/main" class="text-2xl font-bold" style="font-family: 'Brush Script MT', cursive;">Snapia</a>

        <div class="flex gap-5 items-center">
            <a href="/main" class="text-2xl hover:opacity-50">🏠</a>
            <a href="/profile">
                <img th:src="${#authentication.principal.users.profileImageUrl != null ? #authentication.principal.users.profileImageUrl : 'https://i.pravatar.cc/150?u=me'}"
                     alt="profile"
                     class="w-7 h-7 rounded-full object-cover border border-gray-300">
            </a>
        </div>
    </div>
</nav>

<!-- 메인 컨텐츠 -->
<div class="mt-20 max-w-4xl mx-auto">
    <div class="flex bg-white border border-gray-300 rounded-lg min-h-screen">
        <!-- 사이드바 메뉴 -->
        <div class="w-64 border-r border-gray-300">
            <ul class="flex flex-col">
                <li>
                    <a href="/profile/update"
                       class="block px-8 py-4 border-l-2 border-black font-semibold hover:bg-gray-50">
                        프로필 편집
                    </a>
                </li>
                <li>
                    <a href="/profile/password"
                       class="block px-8 py-4 border-l-2 border-transparent hover:bg-gray-50 hover:border-gray-300">
                        비밀번호 변경
                    </a>
                </li>
                <li>
                    <a href="/profile/apps"
                       class="block px-8 py-4 border-l-2 border-transparent hover:bg-gray-50 hover:border-gray-300">
                        앱 및 웹사이트
                    </a>
                </li>
                <li>
                    <a href="/profile/notifications"
                       class="block px-8 py-4 border-l-2 border-transparent hover:bg-gray-50 hover:border-gray-300">
                        알림
                    </a>
                </li>
                <li>
                    <a href="/profile/privacy"
                       class="block px-8 py-4 border-l-2 border-transparent hover:bg-gray-50 hover:border-gray-300">
                        개인정보 및 보안
                    </a>
                </li>
            </ul>
        </div>

        <!-- 프로필 편집 폼 -->
        <div class="flex-1 px-20 py-8">
            <form th:action="@{/profile/update}" method="post" th:object="${profile}" enctype="multipart/form-data" class="space-y-8">

                <!-- 프로필 사진 섹션 -->
                <div class="flex items-center gap-8">
                    <div class="relative">
                        <img id="preview"
                             th:src="${profile.profileImageUrl != null ? '/upload/' + profile.profileImageUrl : 'https://i.pravatar.cc/150?u=default'}"
                             alt="프로필 사진"
                             class="w-24 h-24 rounded-full object-cover border border-gray-300">
                    </div>
                    <div>
                        <h2 class="text-xl font-normal mb-1" th:text="*{snapiaId}">사용자아이디</h2>
                        <label for="file-input"
                               class="text-sm font-semibold text-blue-500 cursor-pointer hover:text-blue-700">
                            프로필 사진 바꾸기
                        </label>
                        <input id="file-input"
                               type="file"
                               th:field="*{multipartFile}"
                               onchange="readURL(this);"
                               accept="image/*"
                               class="hidden">
                    </div>
                </div>

                <!-- 사용자 이름 -->
                <div class="flex">
                    <label class="w-32 pt-2 text-right pr-8 font-semibold text-sm">사용자 이름</label>
                    <div class="flex-1">
                        <input type="text"
                               th:field="*{snapiaId}"
                               th:value="*{snapiaId}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-gray-400">
                        <p class="text-xs text-gray-500 mt-2">
                            대부분의 경우 14일 이내에 사용자 이름을 다시 변경할 수 있습니다.
                        </p>
                    </div>
                </div>

                <!-- 이름 -->
                <div class="flex">
                    <label class="w-32 pt-2 text-right pr-8 font-semibold text-sm">이름</label>
                    <div class="flex-1">
                        <input type="text"
                               th:field="*{name}"
                               th:value="*{name}"
                               placeholder="이름"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-gray-400">
                        <p class="text-xs text-gray-500 mt-2">
                            사람들이 이름, 별명 또는 비즈니스 이름 등 회원님의 알려진 이름을 사용하여 회원님의 계정을 찾을 수 있도록 도와주세요.
                        </p>
                    </div>
                </div>

                <!-- 소개 -->
                <div class="flex">
                    <label class="w-32 pt-2 text-right pr-8 font-semibold text-sm">소개</label>
                    <div class="flex-1">
                        <textarea th:field="*{bio}"
                                  rows="3"
                                  th:text="*{bio}"
                                  placeholder="소개"
                                  maxlength="150"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-gray-400 resize-none"></textarea>
                        <p class="text-xs text-gray-500 mt-2">
                            <span id="bio-count">0</span> / 150
                        </p>
                    </div>
                </div>

                <!-- 이메일 -->
                <div class="flex">
                    <label class="w-32 pt-2 text-right pr-8 font-semibold text-sm">이메일</label>
                    <div class="flex-1">
                        <input type="email"
                               th:field="*{email}"
                               th:value="*{email}"
                               placeholder="이메일"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-gray-400">
                    </div>
                </div>

                <!-- 성별 -->
                <div class="flex">
                    <label class="w-32 pt-2 text-right pr-8 font-semibold text-sm">성별</label>
                    <div class="flex-1">
                        <select th:field="*{gender}"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-gray-400 bg-white">
                            <option value="MAN">남성</option>
                            <option value="WOMAN">여성</option>
                            <option value="UNKNOWN">비공개</option>
                        </select>
                    </div>
                </div>

                <!-- 제출 버튼 -->
                <div class="flex">
                    <div class="w-32"></div>
                    <div class="flex-1 flex gap-4">
                        <button type="submit"
                                class="px-6 py-1.5 bg-blue-500 text-white text-sm font-semibold rounded-lg hover:bg-blue-600 transition-colors">
                            제출
                        </button>
                        <a href="/profile"
                           class="px-6 py-1.5 text-sm font-semibold text-blue-500 hover:text-blue-700">
                            취소
                        </a>
                    </div>
                </div>

                <!-- 계정 비활성화 -->
                <div class="flex pt-8 border-t border-gray-300">
                    <div class="w-32"></div>
                    <div class="flex-1">
                        <button type="button"
                                onclick="if(confirm('정말로 계정을 일시적으로 비활성화하시겠습니까?')) window.location.href='/profile/disable'"
                                class="text-sm font-semibold text-blue-500 hover:text-blue-700">
                            계정을 일시적으로 비활성화
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    // 프로필 이미지 미리보기
    function readURL(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 소개 글자 수 카운트
    const bioTextarea = document.querySelector('textarea[name="bio"]');
    const bioCount = document.getElementById('bio-count');

    function updateBioCount() {
        const count = bioTextarea.value.length;
        bioCount.textContent = count;

        if (count > 150) {
            bioCount.classList.add('text-red-500');
        } else {
            bioCount.classList.remove('text-red-500');
        }
    }

    if (bioTextarea) {
        bioTextarea.addEventListener('input', updateBioCount);
        // 초기 카운트 설정
        updateBioCount();
    }

    // 이미지 업로드 드래그 앤 드롭
    const preview = document.getElementById('preview');
    const fileInput = document.getElementById('file-input');

    preview.addEventListener('click', () => {
        fileInput.click();
    });

    preview.addEventListener('dragover', (e) => {
        e.preventDefault();
        preview.classList.add('opacity-70');
    });

    preview.addEventListener('dragleave', () => {
        preview.classList.remove('opacity-70');
    });

    preview.addEventListener('drop', (e) => {
        e.preventDefault();
        preview.classList.remove('opacity-70');

        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            fileInput.files = e.dataTransfer.files;
            readURL(fileInput);
        }
    });
</script>

</body>
</html>
