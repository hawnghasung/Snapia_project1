<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="notiScript">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

    <style>
        .noti-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            z-index: 99999;
            animation: slideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 300px;
            max-width: 360px;
            border: 1px solid #efefef;
        }
        .noti-toast img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #dbdbdb;
        }
        .noti-toast .noti-text {
            font-size: 14px;
            color: #262626;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            flex: 1;
            padding-top: 2px;
        }
        .noti-toast .noti-text .noti-id {
            font-weight: 700;
            color: #262626;
        }
        .noti-toast .noti-text .noti-msg {
            color: #262626;
        }
        .noti-toast .noti-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .noti-btn-accept {
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .noti-btn-accept:hover {
            background: #1877f2;
        }
        .noti-btn-decline {
            background: #efefef;
            color: #262626;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .noti-btn-decline:hover {
            background: #dbdbdb;
        }
        .noti-close {
            background: none;
            border: none;
            color: #8e8e8e;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
        }
        .noti-close:hover {
            color: #262626;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slideOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(20px) scale(0.95); }
        }
        .noti-toast.removing {
            animation: slideOut 0.25s ease forwards;
        }
    </style>

    <script th:inline="javascript">
        const userId = [[${#authentication.principal.users.uid}]];

        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function() {
            console.log('WebSocket 연결 성공! userId:', userId);
            stompClient.subscribe('/s/noti/' + userId, function(message) {
                console.log('알림 수신:', message.body);
                const notification = JSON.parse(message.body);
                showToast(notification);
            });
        }, function(error) {
            console.error('WebSocket 연결 실패:', error);
        });

        function showToast(notification) {
            const toast = document.createElement('div');
            toast.className = 'noti-toast';

            const isFollowRequest = notification.notificationType === 'FOLLOW_REQUEST';

            // NotificationResponseDTO 필드명에 맞게 수정
            const profileImg = notification.senderProfileImageUrl
                ? '/upload/' + notification.senderProfileImageUrl
                : 'https://i.pravatar.cc/150?u=' + notification.senderUid;

            toast.innerHTML = `
                <img src="${profileImg}" alt="프로필"/>
                <div class="noti-text">
                    <span class="noti-id">${notification.senderSnapiaId}</span>
                    <span class="noti-msg">${isFollowRequest ? '님이 팔로우를 요청했습니다.' : '님이 팔로우 요청을 수락했습니다.'}</span>
                    ${isFollowRequest ? `
                    <div class="noti-actions">
                        <button class="noti-btn-accept" onclick="acceptFollow(${notification.senderUid}, this)">수락</button>
                        <button class="noti-btn-decline" onclick="declineFollow(${notification.senderUid}, this)">거절</button>
                    </div>` : ''}
                </div>
                <button class="noti-close" onclick="removeToast(this)">✕</button>
            `;

            document.body.appendChild(toast);

            // FOLLOW_ACCEPTED는 4초 후 자동으로 사라짐
            if (!isFollowRequest) {
                setTimeout(() => removeToast(toast.querySelector('.noti-close')), 4000);
            }
        }

        function removeToast(btn) {
            const toast = btn.closest('.noti-toast');
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 250);
        }

        function acceptFollow(fromUserId, btn) {
            fetch(`/follow/${fromUserId}/accept`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        removeToast(btn.closest('.noti-toast').querySelector('.noti-close'));
                    } else {
                        alert(data.message || '수락 실패');
                    }
                })
                .catch(err => console.error('수락 오류:', err));
        }

        function declineFollow(fromUserId, btn) {
            fetch(`/follow/${fromUserId}/decline`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        removeToast(btn.closest('.noti-toast').querySelector('.noti-close'));
                    } else {
                        alert(data.message || '거절 실패');
                    }
                })
                .catch(err => console.error('거절 오류:', err));
        }
    </script>
</head>
<body>
</body>
</html>
